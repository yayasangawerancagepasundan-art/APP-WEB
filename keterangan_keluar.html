<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Keterangan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#fff;
  overflow-x:hidden;
}

/* ================= WAVE ================= */
.wave{
  position:fixed;
  bottom:-120px;
  left:0;
  width:200%;
  height:180px;
  border-radius:45%;
  animation:waveMove 12s linear infinite;
  z-index:0;
}
.wave:nth-child(1){background:#ff0000;opacity:0.9;}
.wave:nth-child(2){background:#ff1a1a;opacity:0.7;animation-duration:14s;}
.wave:nth-child(3){background:#ff3333;opacity:0.5;animation-duration:16s;}
.wave:nth-child(4){background:#ff6666;opacity:0.35;animation-duration:18s;}
.wave:nth-child(5){background:#ff9999;opacity:0.25;animation-duration:20s;}

@keyframes waveMove{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

/* ================= TOPBAR ================= */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
  position:relative;
  z-index:2;
}

.logo img{
  width:150px;
}

.avatar{
  width:72px;
  height:72px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #fff;
  box-shadow:0 8px 20px rgba(0,0,0,0.18);
}

/* ================= NAMA USER ================= */
.welcome{
  padding:0 20px;
  margin-top:5px;
  position:relative;
  z-index:2;
}

.welcome h2{
  font-size:22px;
  font-weight:600;
}

/* ================= CARD ================= */
.card{
  background:#fff;
  margin:20px;
  padding:20px;
  border-radius:20px;
  box-shadow:0 12px 30px rgba(0,0,0,0.08);
  border:1px solid rgba(0,0,0,0.03);
  position:relative;
  z-index:2;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-bottom:14px;
}

.label{
  font-size:13px;
  color:#777;
}

.value{
  font-size:14px;
  font-weight:600;
}

/* ================= WARNING ================= */
.warning{
  margin:0 20px;
  color:#ff0000;
  font-weight:600;
  position:relative;
  z-index:2;
}

/* ================= OPTION ================= */
.option{
  margin:10px 20px;
  padding:15px;
  border-radius:12px;
  border:1px solid #ddd;
  cursor:pointer;
  position:relative;
  z-index:2;
}

.option.active{
  background:#ffe5e5;
  border-color:#ff0000;
  color:#ff0000;
  font-weight:600;
}

/* ================= BUTTON ================= */
.btn{
  margin:10px 20px;
  width:calc(100% - 40px);
  padding:15px;
  border:none;
  border-radius:15px;
  background:linear-gradient(135deg,#ff0000,#ff4d4d);
  color:#fff;
  font-weight:600;
  box-shadow:0 6px 15px rgba(255,0,0,0.25);
  position:relative;
  z-index:2;
}

/* ================= LOADING ================= */
.loading{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.loading-text span{
  display:inline-block;
  font-weight:600;
  color:#ff0000;
  font-size:16px;
  opacity:0;
  animation:fadeSlide 1.5s infinite;
}

.loading-text span:nth-child(1){animation-delay:0s;}
.loading-text span:nth-child(2){animation-delay:0.1s;}
.loading-text span:nth-child(3){animation-delay:0.2s;}
.loading-text span:nth-child(4){animation-delay:0.3s;}
.loading-text span:nth-child(5){animation-delay:0.4s;}
.loading-text span:nth-child(6){animation-delay:0.5s;}
.loading-text span:nth-child(7){animation-delay:0.6s;}
.loading-text span:nth-child(8){animation-delay:0.7s;}
.loading-text span:nth-child(9){animation-delay:0.8s;}
.loading-text span:nth-child(10){animation-delay:0.9s;}
.loading-text span:nth-child(11){animation-delay:1s;}
.loading-text span:nth-child(12){animation-delay:1.1s;}

@keyframes fadeSlide{
  0%{opacity:0; transform:translateX(20px);}
  50%{opacity:1; transform:translateX(0);}
  100%{opacity:0; transform:translateX(-10px);}
}
</style>
</head>

<body>

<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>

<div class="topbar">
  <div class="logo">
    <img src="jelas.png">
  </div>
  <img id="fotoUser" class="avatar">
</div>

<div class="welcome">
  <h2 id="namaUser">-</h2>
</div>

<div class="card">
  <div class="row">
    <div class="label">Perusahaan</div>
    <div class="value" id="perusahaan">-</div>
  </div>
  <div class="row">
    <div class="label">Shift</div>
    <div class="value" id="shift">-</div>
  </div>
  <div class="row">
    <div class="label">Jam Masuk</div>
    <div class="value" id="jamMasuk">-</div>
  </div>
</div>

<div class="warning">⚠️ BELUM JAM PULANG</div>

<div class="option" onclick="pilih(this)">SAKIT</div>
<div class="option" onclick="pilih(this)">IZIN PRIBADI</div>
<div class="option" onclick="pilih(this)">URUSAN KELUARGA</div>
<div class="option" onclick="pilih(this)">KEGIATAN DINAS</div>
<div class="option" onclick="pilih(this)">KEADAAN DARURAT</div>
<div class="option" onclick="pilih(this)">KEPERLUAN MENDESAK</div>

<button class="btn" onclick="kirim()">KIRIM</button>

<div class="loading" id="loading">
  <div class="loading-text">
    <span>H</span><span>A</span><span>R</span><span>A</span><span>P</span>
    <span> </span>
    <span>T</span><span>U</span><span>N</span><span>G</span><span>G</span><span>U</span>
  </div>
</div>

<script>
const URL = "https://young-river-168a.yayasangawerancagepasundan.workers.dev/";

let userLogin = JSON.parse(localStorage.getItem("user") || "{}");
let selected = "";

function showLoad(){ document.getElementById("loading").style.display="flex"; }
function hideLoad(){ document.getElementById("loading").style.display="none"; }

function pilih(el){
  document.querySelectorAll(".option").forEach(o=>o.classList.remove("active"));
  el.classList.add("active");
  selected = el.innerText;
}

async function loadData(){
  showLoad();

  try{

    let res = await fetch(URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        action:"get_user",
        username:userLogin.username,
        device_id:userLogin.device_id
      })
    });

    let data = await res.json();

    if(data.status==="ok"){
      document.getElementById("namaUser").innerText = data.data.nama || "-";
      document.getElementById("perusahaan").innerText = data.data.perusahaan || "-";
      document.getElementById("fotoUser").src = data.data.foto || "";
    }

  }catch(e){
    alert("Gagal load data");
  }

  hideLoad();
}

async function kirim(){

  if(!selected){
    alert("Pilih keterangan dulu");
    return;
  }

  showLoad();

  navigator.geolocation.getCurrentPosition(async (pos)=>{

    try{

      let res = await fetch(URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          action:"absen_keterangan",
          username:userLogin.username,
          device_id:userLogin.device_id,
          lat:pos.coords.latitude,
          lng:pos.coords.longitude,
          keterangan:selected
        })
      });

      let data = await res.json();

      if(data.status==="ok"){
        location.href="dashboard-user.html";
      }else{
        alert(data.msg || "Gagal kirim");
      }

    }catch(e){
      alert("Server error");
    }

    hideLoad();

  },{
    enableHighAccuracy:true
  });
}

loadData();
</script>

</body>
</html>
