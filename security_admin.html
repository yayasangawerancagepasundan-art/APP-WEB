<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Security Access</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#020708;
  color:#B6FF00;
  font-family:Arial, Helvetica, sans-serif;
}

/* =====================================================
   BACKGROUND
   ===================================================== */

.security-page{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 28% 50%,
      rgba(35,90,45,.16),
      transparent 30%),
    radial-gradient(circle at 80% 50%,
      rgba(20,70,35,.10),
      transparent 30%),
    #020708;
}

/* GRID */

.security-page::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.18;

  background-image:
    linear-gradient(rgba(182,255,0,.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(182,255,0,.08) 1px, transparent 1px);

  background-size:40px 40px;

  mask-image:
    radial-gradient(circle at center,#000 20%,transparent 80%);
}

/* =====================================================
   CIRCUIT AREA
   ===================================================== */

.circuit{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

/* circuit horizontal */

.line{
  position:absolute;
  height:2px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(182,255,0,.15),
    #B6FF00,
    rgba(182,255,0,.15),
    transparent
  );

  box-shadow:
    0 0 5px rgba(182,255,0,.8),
    0 0 14px rgba(182,255,0,.35);

  animation:flow 3s linear infinite;
}

.line::after{
  content:"";
  position:absolute;
  top:-3px;
  left:-20px;
  width:25px;
  height:8px;

  background:#B6FF00;

  box-shadow:
    0 0 8px #B6FF00,
    0 0 18px #B6FF00;

  border-radius:50%;

  animation:energy 3s linear infinite;
}

@keyframes flow{
  from{
    transform:translateX(-20%);
  }

  to{
    transform:translateX(20%);
  }
}

@keyframes energy{
  from{
    left:-30px;
  }

  to{
    left:100%;
  }
}

/* desktop circuit */

.l1{
  width:42%;
  left:0;
  top:24%;
}

.l2{
  width:48%;
  left:5%;
  top:34%;
  animation-delay:.7s;
}

.l3{
  width:40%;
  left:0;
  top:66%;
  animation-delay:1.1s;
}

.l4{
  width:45%;
  left:8%;
  top:76%;
  animation-delay:1.8s;
}

.l5{
  width:30%;
  left:24%;
  top:44%;
  animation-delay:.4s;
}

/* right side */

.r1{
  width:35%;
  right:0;
  top:20%;
  animation-delay:1s;
}

.r2{
  width:28%;
  right:4%;
  top:39%;
  animation-delay:1.7s;
}

.r3{
  width:38%;
  right:0;
  top:68%;
  animation-delay:.8s;
}

/* vertical circuit */

.vline{
  position:absolute;
  width:2px;

  background:linear-gradient(
    180deg,
    transparent,
    #B6FF00,
    transparent
  );

  box-shadow:
    0 0 8px rgba(182,255,0,.7);

  animation:vflow 4s linear infinite;
}

@keyframes vflow{
  from{
    transform:translateY(-20%);
  }

  to{
    transform:translateY(20%);
  }
}

.v1{
  height:35%;
  left:13%;
  top:0;
}

.v2{
  height:40%;
  left:31%;
  top:15%;
  animation-delay:1.2s;
}

.v3{
  height:30%;
  right:17%;
  top:0;
  animation-delay:.6s;
}

/* =====================================================
   NODES
   ===================================================== */

.node{
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;

  background:#B6FF00;

  box-shadow:
    0 0 6px #B6FF00,
    0 0 15px #B6FF00,
    0 0 30px rgba(182,255,0,.7);

  animation:pulseNode 1.8s infinite alternate;
}

@keyframes pulseNode{
  from{
    opacity:.35;
    transform:scale(.7);
  }

  to{
    opacity:1;
    transform:scale(1.3);
  }
}

.n1{left:13%;top:24%;}
.n2{left:31%;top:34%;}
.n3{left:8%;top:66%;}
.n4{left:28%;top:76%;}
.n5{right:17%;top:20%;}
.n6{right:8%;top:39%;}
.n7{right:17%;top:68%;}

/* =====================================================
   MAIN CONTENT
   ===================================================== */

.content{
  position:relative;
  z-index:10;

  width:100%;
  height:100%;

  display:grid;
  grid-template-columns:55% 45%;
  align-items:center;
}

/* =====================================================
   LEFT SECURITY CORE
   ===================================================== */

.core-area{
  position:relative;

  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;
}

.core{
  position:relative;

  width:300px;
  height:300px;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* outer rings */

.ring{
  position:absolute;

  border:1px solid rgba(182,255,0,.35);
  border-radius:50%;

  box-shadow:
    0 0 20px rgba(182,255,0,.08);

  animation:ringPulse 3s ease-in-out infinite;
}

.ring.one{
  width:300px;
  height:300px;
}

.ring.two{
  width:230px;
  height:230px;
  animation-delay:.5s;
}

.ring.three{
  width:170px;
  height:170px;
  animation-delay:1s;
}

@keyframes:ringPulse{
  0%,100%{
    opacity:.25;
    transform:scale(.96);
  }

  50%{
    opacity:.75;
    transform:scale(1.03);
  }
}

/* lock */

.lock{
  position:relative;
  z-index:5;

  width:115px;
  height:105px;

  border:3px solid #B6FF00;

  border-radius:15px;

  background:
    radial-gradient(
      circle,
      rgba(182,255,0,.12),
      rgba(0,0,0,.2)
    );

  box-shadow:
    0 0 15px rgba(182,255,0,.8),
    0 0 40px rgba(182,255,0,.35),
    inset 0 0 25px rgba(182,255,0,.08);
}

/* lock shackle */

.lock::before{
  content:"";

  position:absolute;

  width:54px;
  height:60px;

  left:50%;
  top:-48px;

  transform:translateX(-50%);

  border:3px solid #B6FF00;

  border-bottom:0;

  border-radius:32px 32px 0 0;

  box-shadow:
    0 0 12px rgba(182,255,0,.6);
}

/* lock keyhole */

.lock::after{
  content:"";

  position:absolute;

  width:16px;
  height:27px;

  left:50%;
  top:38px;

  transform:translateX(-50%);

  border-radius:50% 50% 40% 40%;

  background:#B6FF00;

  box-shadow:
    0 0 12px #B6FF00;
}

/* =====================================================
   RIGHT INFORMATION
   ===================================================== */

.info{
  position:relative;

  width:min(470px,85%);

  padding:35px;

  color:#B6FF00;
}

.top-label{
  font-size:12px;
  letter-spacing:5px;

  opacity:.75;

  margin-bottom:18px;
}

.title{
  font-size:38px;
  font-weight:700;

  letter-spacing:2px;

  text-shadow:
    0 0 5px #B6FF00,
    0 0 15px rgba(182,255,0,.7);
}

.subtitle{
  margin-top:10px;

  font-size:13px;
  letter-spacing:3px;

  opacity:.7;
}

.account{
  margin-top:45px;

  border-left:2px solid #B6FF00;

  padding-left:20px;
}

.account-label{
  font-size:10px;
  letter-spacing:4px;
  opacity:.6;
}

.account-role{
  margin-top:8px;

  font-size:22px;
  font-weight:bold;

  letter-spacing:2px;
}

.account-user{
  margin-top:5px;

  font-size:13px;

  opacity:.7;
}

.status{
  margin-top:40px;

  display:flex;
  align-items:center;
  gap:12px;

  font-size:13px;
  letter-spacing:2px;
}

.status-dot{
  width:10px;
  height:10px;

  border-radius:50%;

  background:#B6FF00;

  box-shadow:
    0 0 8px #B6FF00,
    0 0 18px #B6FF00;

  animation:statusPulse 1.3s infinite;
}

@keyframes statusPulse{
  50%{
    opacity:.3;
  }
}

.nfc-button{
  margin-top:25px;

  width:100%;
  height:58px;

  border:1px solid #B6FF00;

  background:rgba(182,255,0,.04);

  color:#B6FF00;

  font-size:13px;
  font-weight:bold;

  letter-spacing:3px;

  cursor:pointer;

  box-shadow:
    0 0 10px rgba(182,255,0,.15);

  transition:.25s;
}

.nfc-button:hover{
  background:rgba(182,255,0,.1);

  box-shadow:
    0 0 18px rgba(182,255,0,.35);
}

.nfc-button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.exit{
  margin-top:20px;

  background:none;
  border:0;

  color:#B6FF00;

  font-size:10px;

  letter-spacing:3px;

  opacity:.5;

  cursor:pointer;
}

.exit:hover{
  opacity:1;
}

/* =====================================================
   SUCCESS / ERROR
   ===================================================== */

.success{
  color:#B6FF00;
}

.error{
  color:#ff3b3b;
}

.error .status-dot{
  background:#ff3b3b;

  box-shadow:
    0 0 10px #ff3b3b,
    0 0 20px #ff3b3b;
}

.access-granted .lock{
  animation:unlock 1s ease forwards;
}

@keyframes unlock{
  50%{
    transform:scale(1.08);
    box-shadow:
      0 0 30px #B6FF00,
      0 0 80px rgba(182,255,0,.7);
  }

  100%{
    transform:scale(1);
  }
}

/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:700px){

  .security-page{
    background:
      radial-gradient(
        circle at center,
        rgba(35,90,45,.18),
        transparent 48%
      ),
      #020708;
  }

  .content{
    display:block;
    position:relative;
  }

  /* circuit tetap memenuhi layar */

  .circuit{
    opacity:.8;
  }

  .l1,
  .l2,
  .l3,
  .l4,
  .l5{
    width:85%;
    left:0;
  }

  .r1,
  .r2,
  .r3{
    width:70%;
    right:0;
  }

  /* =================================================
     CORE MENJADI BACKGROUND DI TENGAH
     ================================================= */

  .core-area{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:2;
  }

  .core{
    position:absolute;

    width:390px;
    height:390px;

    left:50%;
    top:52%;

    transform:translate(-50%,-50%);

    opacity:.55;
  }

  .ring.one{
    width:390px;
    height:390px;
  }

  .ring.two{
    width:310px;
    height:310px;
  }

  .ring.three{
    width:230px;
    height:230px;
  }

  .lock{
    width:150px;
    height:135px;

    opacity:.65;

    filter:
      drop-shadow(0 0 15px #B6FF00);
  }

  .lock::before{
    width:70px;
    height:70px;

    top:-58px;
  }

  .lock::after{
    top:48px;
  }

  /* =================================================
     INFO DI DEPAN GEMBOK
     ================================================= */

  .info{
    position:absolute;

    z-index:20;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:90%;

    padding:20px;

    text-align:center;
  }

  .top-label{
    font-size:10px;
    letter-spacing:4px;

    margin-bottom:14px;
  }

  .title{
    font-size:28px;

    letter-spacing:2px;
  }

  .subtitle{
    font-size:10px;

    letter-spacing:2px;
  }

  .account{
    margin-top:30px;

    border-left:0;
    border-top:1px solid rgba(182,255,0,.45);

    padding:15px 0 0;
  }

  .account-role{
    font-size:18px;
  }

  .account-user{
    font-size:12px;
  }

  .status{
    justify-content:center;

    margin-top:25px;

    font-size:11px;
  }

  .nfc-button{
    width:85%;
    margin:20px auto 0;

    height:52px;

    font-size:11px;
  }

  .exit{
    margin-top:16px;
  }

}

/* =====================================================
   SMALL MOBILE
   ===================================================== */

@media(max-width:380px){

  .core{
    width:330px;
    height:330px;
  }

  .ring.one{
    width:330px;
    height:330px;
  }

  .ring.two{
    width:260px;
    height:260px;
  }

  .ring.three{
    width:195px;
    height:195px;
  }

  .lock{
    width:125px;
    height:115px;
  }

  .title{
    font-size:24px;
  }

  .account-role{
    font-size:16px;
  }

}

/* =====================================================
   HIDE BUTTON ON SUPPORTED WEB NFC
   ===================================================== */

.webnfc-supported .nfc-button{
  display:none;
}

</style>
</head>

<body>

<div class="security-page">

  <!-- =================================================
       CIRCUIT BACKGROUND
       ================================================= -->

  <div class="circuit">

    <div class="line l1"></div>
    <div class="line l2"></div>
    <div class="line l3"></div>
    <div class="line l4"></div>
    <div class="line l5"></div>

    <div class="line r1"></div>
    <div class="line r2"></div>
    <div class="line r3"></div>

    <div class="vline v1"></div>
    <div class="vline v2"></div>
    <div class="vline v3"></div>

    <div class="node n1"></div>
    <div class="node n2"></div>
    <div class="node n3"></div>
    <div class="node n4"></div>
    <div class="node n5"></div>
    <div class="node n6"></div>
    <div class="node n7"></div>

  </div>


  <!-- =================================================
       CONTENT
       ================================================= -->

  <div class="content">

    <!-- =================================================
         NFC CORE
         ================================================= -->

    <div class="core-area">

      <div class="core" id="core">

        <div class="ring one"></div>
        <div class="ring two"></div>
        <div class="ring three"></div>

        <div class="lock"></div>

      </div>

    </div>


    <!-- =================================================
         INFORMATION
         ================================================= -->

    <div class="info" id="info">

      <div class="top-label">
        SECURE ACCESS
      </div>

      <div class="title">
        VERIFIKASI ADMIN
      </div>

      <div class="subtitle">
        NFC AUTHENTICATION REQUIRED
      </div>

      <div class="account">

        <div class="account-label">
          ACCOUNT
        </div>

        <div
          class="account-role"
          id="role">
          ADMIN
        </div>

        <div
          class="account-user"
          id="username">
          -
        </div>

      </div>

      <div
        class="status"
        id="status">

        <span class="status-dot"></span>

        <span id="statusText">
          MENUNGGU KARTU NFC
        </span>

      </div>

      <button
        class="nfc-button"
        id="nfcButton">

        AKTIFKAN NFC

      </button>

      <button
        class="exit"
        id="exitButton">

        KELUAR

      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   CONFIG
   ===================================================== */

const URL =
  "https://security-system.yayasangawerancagepasundan.workers.dev/";


/* =====================================================
   AMBIL SESSION ADMIN
   ===================================================== */

let adminSecurity = null;

try{

  adminSecurity =
    JSON.parse(
      localStorage.getItem("adminSecurity") || "{}"
    );

}catch(e){

  adminSecurity = {};

}


/* =====================================================
   VALIDASI SESSION
   ===================================================== */

if(
  !adminSecurity ||
  !adminSecurity.username
){

  window.location.href = "index.html";

}


/* =====================================================
   TAMPILKAN DATA ADMIN
   ===================================================== */

document.getElementById("username").textContent =
  adminSecurity.username || "-";

document.getElementById("role").textContent =
  adminSecurity.role || "ADMIN";


/* =====================================================
   ELEMENT
   ===================================================== */

const statusText =
  document.getElementById("statusText");

const statusBox =
  document.getElementById("status");

const nfcButton =
  document.getElementById("nfcButton");

const exitButton =
  document.getElementById("exitButton");

const info =
  document.getElementById("info");

const core =
  document.getElementById("core");


/* =====================================================
   STATUS
   ===================================================== */

function setStatus(text, type="normal"){

  statusText.textContent = text;

  statusBox.classList.remove(
    "success",
    "error"
  );

  if(type === "success"){
    statusBox.classList.add("success");
  }

  if(type === "error"){
    statusBox.classList.add("error");
  }

}


/* =====================================================
   VERIFY NFC KE BACKEND
   ===================================================== */

async function verifyNfcCredential(
  credential
){

  try{

    setStatus(
      "MEMVERIFIKASI NFC...",
      "normal"
    );

    const res =
      await fetch(URL,{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          action:"verify_nfc",

          username:
            adminSecurity.username,

          nfc_credential:
            credential

        })

      });

    const data =
      await res.json();


    /* ===============================================
       NFC BERHASIL
       =============================================== */

    if(data.status === "ok"){

      setStatus(
        "ACCESS GRANTED",
        "success"
      );

      document
        .querySelector(".security-page")
        .classList.add("access-granted");

      setTimeout(()=>{

        /*
         * Backend adalah sumber tujuan dashboard.
         */

        let next =
          data.user &&
          data.user.next
            ? data.user.next
            : adminSecurity.next;

        if(!next){
          next = "index.html";
        }

        window.location.href = next;

      },1500);

      return true;

    }


    /* ===============================================
       NFC SALAH
       =============================================== */

    if(data.status === "nfc_mismatch"){

      setStatus(
        "ACCESS DENIED — NFC TIDAK SESUAI",
        "error"
      );

      return false;

    }


    setStatus(
      data.msg || "VERIFIKASI GAGAL",
      "error"
    );

    return false;

  }catch(e){

    console.error(e);

    setStatus(
      "KONEKSI KE SERVER GAGAL",
      "error"
    );

    return false;

  }

}


/* =====================================================
   WEB NFC
   ===================================================== */

async function startNfc(){

  if(
    !("NDEFReader" in window)
  ){

    setStatus(
      "NFC TIDAK DIDUKUNG BROWSER",
      "error"
    );

    nfcButton.style.display = "block";

    return;

  }

  try{

    const ndef =
      new NDEFReader();

    await ndef.scan();

    setStatus(
      "MENUNGGU KARTU NFC...",
      "normal"
    );

    nfcButton.style.display = "none";


    ndef.onreadingerror = ()=>{

      setStatus(
        "NFC TIDAK DAPAT DIBACA",
        "error"
      );

    };


    ndef.onreading = async event =>{

      try{

        setStatus(
          "NFC TERDETEKSI — MEMBACA...",
          "normal"
        );


        let credential = "";


        /*
         * ==========================================
         * BACA RECORD NDEF
         * ==========================================
         */

        for(
          const record of event.message.records
        ){

          if(
            record.recordType === "text"
          ){

            const decoder =
              new TextDecoder(
                record.encoding || "utf-8"
              );

            credential =
              decoder.decode(
                record.data
              ).trim();

            break;

          }


          if(
            record.recordType === "mime"
          ){

            const decoder =
              new TextDecoder();

            credential =
              decoder.decode(
                record.data
              ).trim();

            break;

          }

        }


        if(!credential){

          setStatus(
            "CREDENTIAL NFC KOSONG",
            "error"
          );

          return;

        }


        /*
         * Kirim credential ke backend.
         */

        await verifyNfcCredential(
          credential
        );


      }catch(err){

        console.error(err);

        setStatus(
          "NFC GAGAL DIBACA",
          "error"
        );

      }

    };

  }catch(err){

    console.error(err);

    setStatus(
      "NFC TIDAK DAPAT DIAKTIFKAN",
      "error"
    );

  }

}


/* =====================================================
   TOMBOL NFC
   ===================================================== */

nfcButton.addEventListener(
  "click",
  startNfc
);


/* =====================================================
   KELUAR
   ===================================================== */

exitButton.addEventListener(
  "click",
  ()=>{

    localStorage.removeItem(
      "adminSecurity"
    );

    localStorage.removeItem(
      "user"
    );

    localStorage.removeItem(
      "userLogin"
    );

    window.location.href =
      "index.html";

  }
);


/* =====================================================
   AUTO START
   ===================================================== */

if(
  "NDEFReader" in window
){

  /*
   * Web NFC membutuhkan user gesture
   * pada sebagian browser.
   *
   * Karena itu tombol tetap tersedia.
   */

  setStatus(
    "TEKAN AKTIFKAN NFC",
    "normal"
  );

}else{

  setStatus(
    "NFC TIDAK DIDUKUNG BROWSER",
    "error"
  );

}

</script>

</body>
</html>
