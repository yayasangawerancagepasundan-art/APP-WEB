<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absen</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<meta name="theme-color" content="#ff0000">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#f2f2f2;
}

/* FULL APP */
.card{
  max-width:420px;
  margin:0 auto;
  min-height:100vh;
  background:#fff;
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* LOGO */
.logo-atas{
  width:110px;
  margin-bottom:20px;
}

/* CONTENT */
.content{
  display:flex;
  gap:15px;
  align-items:flex-start;
}

/* DATA */
.data{
  flex:1;
  font-size:13px;
}

.row{
  display:flex;
  margin-bottom:8px;
}

.label{
  width:120px;
  font-weight:600;
  color:#444;
}

.value{
  flex:1;
  word-break:break-word;
}

/* FOTO */
.photo img{
  width:100px;
  height:130px;
  object-fit:cover;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

/* BUTTON */
.btn{
  margin-top:30px;
}

button{
  width:100%;
  padding:16px;
  border:none;
  background:linear-gradient(135deg,#ff0000,#ff4d4d);
  color:#fff;
  font-size:16px;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  box-shadow:0 5px 15px rgba(255,0,0,0.3);
}

/* LOADING (TIDAK DIUBAH) */
.loading{
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(255,255,255,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
}

.wait-text span{
  display:inline-block;
  font-weight:600;
  color:#ff0000;
  font-size:16px;
  opacity:0;
  animation:fadeSlide 1.5s infinite;
}
.wait-text span:nth-child(1){animation-delay:0s;}
.wait-text span:nth-child(2){animation-delay:0.1s;}
.wait-text span:nth-child(3){animation-delay:0.2s;}
.wait-text span:nth-child(4){animation-delay:0.3s;}
.wait-text span:nth-child(5){animation-delay:0.4s;}
.wait-text span:nth-child(6){animation-delay:0.5s;}
.wait-text span:nth-child(7){animation-delay:0.6s;}
.wait-text span:nth-child(8){animation-delay:0.7s;}
.wait-text span:nth-child(9){animation-delay:0.8s;}
.wait-text span:nth-child(10){animation-delay:0.9s;}
.wait-text span:nth-child(11){animation-delay:1s;}
.wait-text span:nth-child(12){animation-delay:1.1s;}

@keyframes fadeSlide{
  0%{opacity:0; transform:translateX(20px);}
  50%{opacity:1; transform:translateX(0);}
  100%{opacity:0; transform:translateX(-10px);}
}

/* RESULT */
.result{
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.box{
  background:#fff;
  padding:30px;
  border-radius:12px;
  text-align:center;
}

.face{
  font-size:60px;
}

/* ANIMASI */
.success{ animation:angguk 0.6s infinite alternate; }
.fail{ animation:geleng 0.6s infinite alternate; }

@keyframes angguk{
  from{transform:rotate(0deg);}
  to{transform:rotate(10deg);}
}
@keyframes geleng{
  from{transform:rotate(-10deg);}
  to{transform:rotate(10deg);}
}

/* WAVE (TIDAK DIUBAH) */
.wave{
  position:fixed;
  bottom:0;
  width:100%;
  z-index:1;
}
</style>
</head>

<body>

<div class="card">

  <div>
    <img src="jelas.png" class="logo-atas">

    <div class="content">
      <div class="data" id="dataUser">Loading...</div>

      <div class="photo">
        <img id="fotoUser" src="">
      </div>
    </div>
  </div>

  <div class="btn">
    <button onclick="absen()">ABSEN SEKARANG</button>
  </div>

</div>

<!-- LOADING (TIDAK DIUBAH) -->
<div class="loading" id="loading">
  <img src="jelas.png" class="logo-atas"> 
  <div class="wait-text"> 
    <span>H</span><span>A</span><span>R</span><span>A</span><span>P</span> 
    <span>&nbsp;</span> 
    <span>T</span><span>U</span><span>N</span><span>G</span><span>G</span><span>U</span> 
  </div> 
</div>

<!-- RESULT -->
<div class="result" id="result">
  <div class="box">
    <div class="face" id="face">😊</div>
    <div id="msg"></div>
  </div>
</div>

<!-- WAVE (TIDAK DIUBAH) -->
<div class="wave">
<svg viewBox="0 0 1440 320">
<path fill="#ff0000" fill-opacity="0.15">
<animate attributeName="d" dur="12s" repeatCount="indefinite"
values="M0,200 C300,100 1100,260 1440,200 L1440,320 L0,320 Z;
M0,160 C500,260 900,80 1440,160 L1440,320 L0,320 Z;
M0,200 C300,100 1100,260 1440,200 L1440,320 L0,320 Z"/>
</path>
</svg>
</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbwkBKSS5jSOqzlbX0uyBMR4BWREwOVSQRHDwY5TM2naZ-MMkBeXmREIdDV3AxgVuqH8/exec";

/* USER */
let raw = localStorage.getItem("userLogin");
let parsed = raw ? JSON.parse(raw) : null;
let user = parsed ? (parsed.user || parsed) : null;

/* FORMAT TANGGAL */
function formatTanggal(tgl){
  if(!tgl) return "-";
  let d = new Date(tgl);
  return d.toLocaleDateString("id-ID");
}

/* LOAD USER */
function loadUser(){

  if(!user){
    document.getElementById("dataUser").innerText="User tidak ditemukan";
    return;
  }

  document.getElementById("dataUser").innerHTML = `
    <div class="row"><div class="label">NIK</div><div class="value">: ${user.nik}</div></div>
    <div class="row"><div class="label">Nama</div><div class="value">: ${user.nama}</div></div>
    <div class="row"><div class="label">Tempat Lahir</div><div class="value">: ${user.tempat}</div></div>
    <div class="row"><div class="label">Tanggal Lahir</div><div class="value">: ${formatTanggal(user.tgl_lahir)}</div></div>
    <div class="row"><div class="label">Umur</div><div class="value">: ${user.umur}</div></div>
    <div class="row"><div class="label">Jenis Kelamin</div><div class="value">: ${user.jk}</div></div>
    <div class="row"><div class="label">Alamat</div><div class="value">: ${user.alamat}</div></div>
    <div class="row"><div class="label">Status</div><div class="value">: ${user.status_perkawinan}</div></div>
    <div class="row"><div class="label">Zona</div><div class="value">: ${user.zona}</div></div>
  `;

  document.getElementById("fotoUser").src = user.foto || "";
}

/* ABSEN */
async function absen(){

  let lat = localStorage.getItem("lat");
  let lng = localStorage.getItem("lng");

  document.getElementById("loading").style.display="flex";

  try{

    let res = await fetch(URL,{
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify({
        action:"absen",
        username:user.username,
        lat, lng
      })
    });

    let data = await res.json();

    document.getElementById("loading").style.display="none";

    let result = document.getElementById("result");
    let face = document.getElementById("face");
    let msg = document.getElementById("msg");

    result.style.display="flex";

    if(data.status === "ok"){
      face.innerText="😊";
      face.className="face success";
      msg.innerText="ABSEN BERHASIL";

      setTimeout(()=>{
        result.style.display="none";
        window.location.href="dashboard_user.html";
      },2000);

    }else{
      face.innerText="😕";
      face.className="face fail";
      msg.innerText=data.msg || "ABSEN GAGAL";

      setTimeout(()=>{ result.style.display="none"; },2000);
    }

  }catch(err){
    document.getElementById("loading").style.display="none";

    let result = document.getElementById("result");
    let face = document.getElementById("face");
    let msg = document.getElementById("msg");

    result.style.display="flex";
    face.innerText="😕";
    face.className="face fail";
    msg.innerText="KONEKSI GAGAL";

    setTimeout(()=>{ result.style.display="none"; },2000);
  }
}

loadUser();

</script>

</body>
</html>
