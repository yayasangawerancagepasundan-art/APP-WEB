<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absen</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#f5f6fa;
  overflow:hidden;
}

/* CARD */
.card{
  max-width:500px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  position:relative;
  z-index:2;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.logo{
  width:150px;
}

.photo img{
  width:110px;
  height:140px;
  object-fit:cover;
  border-radius:12px;
}

/* DATA */
.data{
  margin-top:15px;
  font-size:14px;
}

.row{
  display:flex;
  margin-bottom:8px;
}

.label{
  width:140px;
  font-weight:600;
}

.value{
  flex:1;
}

/* BUTTON */
.btn{
  margin-top:20px;
}

button{
  width:100%;
  padding:16px;
  border:none;
  background:linear-gradient(135deg,#ff0000,#ff4d4d);
  color:#fff;
  font-size:16px;
  border-radius:10px;
  cursor:pointer;
}

/* LOADING (TIDAK DIUBAH) */
.loading{
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(255,255,255,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
}

.wait-text span{
  display:inline-block;
  font-weight:600;
  color:#ff0000;
  font-size:16px;
  opacity:0;
  animation:fadeSlide 1.5s infinite;
}
.wait-text span:nth-child(1){animation-delay:0s;}
.wait-text span:nth-child(2){animation-delay:0.1s;}
.wait-text span:nth-child(3){animation-delay:0.2s;}
.wait-text span:nth-child(4){animation-delay:0.3s;}
.wait-text span:nth-child(5){animation-delay:0.4s;}
.wait-text span:nth-child(6){animation-delay:0.5s;}
.wait-text span:nth-child(7){animation-delay:0.6s;}
.wait-text span:nth-child(8){animation-delay:0.7s;}
.wait-text span:nth-child(9){animation-delay:0.8s;}
.wait-text span:nth-child(10){animation-delay:0.9s;}
.wait-text span:nth-child(11){animation-delay:1s;}
.wait-text span:nth-child(12){animation-delay:1.1s;}

@keyframes fadeSlide{
  0%{opacity:0; transform:translateX(20px);}
  50%{opacity:1; transform:translateX(0);}
  100%{opacity:0; transform:translateX(-10px);}
}

/* RESULT */
.result{
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.box{
  background:#fff;
  padding:30px;
  border-radius:12px;
  text-align:center;
}

.face{
  font-size:60px;
}

.success{ animation:angguk 0.6s infinite alternate; }
.fail{ animation:geleng 0.6s infinite alternate; }

@keyframes angguk{
  from{transform:rotate(0deg);}
  to{transform:rotate(10deg);}
}
@keyframes geleng{
  from{transform:rotate(-10deg);}
  to{transform:rotate(10deg);}
}

/* WAVE (WAJIB 5 LAYER - TIDAK DIUBAH) */
.wave{
  position:fixed;
  bottom:0;
  width:100%;
  z-index:1;
}
</style>
</head>

<body>

<div class="card">

  <!-- HEADER -->
  <div class="header">
    <img src="jelas.png" class="logo">
    <div class="photo">
      <img id="fotoUser" src="">
    </div>
  </div>

  <!-- DATA -->
  <div class="data" id="dataUser"></div>

  <!-- BUTTON -->
  <div class="btn">
    <button onclick="absen()">ABSEN SEKARANG</button>
  </div>

</div>

<!-- LOADING -->
<div class="loading" id="loading">
  <img src="jelas.png" class="logo"> 
  <div class="wait-text"> 
    <span>H</span><span>A</span><span>R</span><span>A</span><span>P</span> 
    <span>&nbsp;</span> 
    <span>T</span><span>U</span><span>N</span><span>G</span><span>G</span><span>U</span> 
  </div> 
</div>

<!-- RESULT -->
<div class="result" id="result">
  <div class="box">
    <div class="face" id="face">😊</div>
    <div id="msg"></div>
  </div>
</div>

<!-- 🔥 5 WAVE FIX -->
<div class="wave">
<svg viewBox="0 0 1440 320">

<path fill="#ff0000" fill-opacity="0.15">
<animate attributeName="d" dur="12s" repeatCount="indefinite"
values="M0,200 C300,100 1100,260 1440,200 L1440,320 L0,320 Z;
M0,160 C500,260 900,80 1440,160 L1440,320 L0,320 Z;
M0,200 C300,100 1100,260 1440,200 L1440,320 L0,320 Z"/>
</path>

<path fill="#ff0000" fill-opacity="0.25">
<animate attributeName="d" dur="10s" repeatCount="indefinite"
values="M0,180 C400,80 1000,280 1440,180 L1440,320 L0,320 Z;
M0,140 C600,300 900,60 1440,140 L1440,320 L0,320 Z;
M0,180 C400,80 1000,280 1440,180 L1440,320 L0,320 Z"/>
</path>

<path fill="#ff0000" fill-opacity="0.35">
<animate attributeName="d" dur="8s" repeatCount="indefinite"
values="M0,220 C300,150 1200,250 1440,220 L1440,320 L0,320 Z;
M0,180 C500,280 1000,120 1440,180 L1440,320 L0,320 Z;
M0,220 C300,150 1200,250 1440,220 L1440,320 L0,320 Z"/>
</path>

<path fill="#ff0000" fill-opacity="0.45">
<animate attributeName="d" dur="6s" repeatCount="indefinite"
values="M0,240 C400,180 1000,300 1440,240 L1440,320 L0,320 Z;
M0,200 C600,320 900,160 1440,200 L1440,320 L0,320 Z;
M0,240 C400,180 1000,300 1440,240 L1440,320 L0,320 Z"/>
</path>

<path fill="#ff0000" fill-opacity="0.6">
<animate attributeName="d" dur="4s" repeatCount="indefinite"
values="M0,260 C300,200 1100,320 1440,260 L1440,320 L0,320 Z;
M0,220 C500,340 1000,180 1440,220 L1440,320 L0,320 Z;
M0,260 C300,200 1100,320 1440,260 L1440,320 L0,320 Z"/>
</path>

</svg>
</div>

<script>
const URL = "https://young-river-168a.yayasangawerancagepasundan.workers.dev/";

let raw = localStorage.getItem("userLogin");
let parsed = raw ? JSON.parse(raw) : null;
let user = parsed ? (parsed.user || parsed) : null;

/* FORMAT TANGGAL */
function formatTanggal(t){
  if(!t) return "-";
  let d = new Date(t);
  return d.toLocaleDateString("id-ID");
}

/* LOAD USER */
function loadUser(){
  if(!user){
    document.getElementById("dataUser").innerText="User tidak ditemukan";
    return;
  }

  document.getElementById("dataUser").innerHTML = `
    <div class="row"><div class="label">NIK</div><div class="value">: ${user.nik}</div></div>
    <div class="row"><div class="label">Nama</div><div class="value">: ${user.nama}</div></div>
    <div class="row"><div class="label">Tempat Lahir</div><div class="value">: ${user.tempat}</div></div>
    <div class="row"><div class="label">Tanggal Lahir</div><div class="value">: ${formatTanggal(user.tgl_lahir)}</div></div>
    <div class="row"><div class="label">Umur</div><div class="value">: ${user.umur}</div></div>
    <div class="row"><div class="label">Jenis Kelamin</div><div class="value">: ${user.jk}</div></div>
    <div class="row"><div class="label">Alamat</div><div class="value">: ${user.alamat}</div></div>
    <div class="row"><div class="label">Status</div><div class="value">: ${user.status_perkawinan}</div></div>
    <div class="row"><div class="label">Zona</div><div class="value">: ${user.zona}</div></div>
  `;

  document.getElementById("fotoUser").src = user.foto || "";
}

/* ABSEN */
async function absen(){

  document.getElementById("loading").style.display="flex";

  try{
    let res = await fetch(URL,{
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=utf-8" // 🔥 INI KUNCINYA
      },
      body: JSON.stringify({
        action:"absen",
        username:user.username
      })
    });

    let data = await res.json();

    document.getElementById("loading").style.display="none";

    let result = document.getElementById("result");
    let face = document.getElementById("face");
    let msg = document.getElementById("msg");

    result.style.display="flex";

    if(data.status === "ok"){
      face.innerText="😊";
      face.className="face success";
      msg.innerText="ABSEN BERHASIL";

      setTimeout(()=>{
        window.location.href="dashboard_user.html";
      },1500);

    }else{
      face.innerText="😕";
      face.className="face fail";
      msg.innerText=data.msg || "ABSEN GAGAL";

      setTimeout(()=>{
        location.reload();
      },1500);
    }

  }catch(err){
    document.getElementById("loading").style.display="none";

    let result = document.getElementById("result");
    let face = document.getElementById("face");
    let msg = document.getElementById("msg");

    result.style.display="flex";

    face.innerText="😕";
    face.className="face fail";
    msg.innerText="SERVER ERROR";

    setTimeout(()=>{
      location.reload();
    },15000);
  }
}
loadUser();
</script>
</body>
</html>
