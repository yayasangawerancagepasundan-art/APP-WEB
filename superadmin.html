<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #020807;
            color: #d8fff4;
            font-family: Arial, sans-serif;
        }

        /* =========================
           DASHBOARD
        ========================= */

        .dashboard {
            min-height: 100vh;
            padding: 30px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px 20px;

            border: 1px solid #123b34;
            background: #06110f;
        }

        .logo {
            color: #00e6a8;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .status {
            color: #00e6a8;
            font-size: 12px;
        }

        .status::before {
            content: "";
            display: inline-block;

            width: 7px;
            height: 7px;

            margin-right: 6px;

            background: #00e6a8;
            border-radius: 50%;

            box-shadow: 0 0 8px #00e6a8;
        }

        /* =========================
           TITLE
        ========================= */

        .title {
            margin-top: 30px;
        }

        .title h1 {
            margin: 0;

            font-size: 24px;
            letter-spacing: 2px;

            color: #00e6a8;
        }

        .title p {
            color: #6e958b;
            font-size: 13px;
        }

        /* =========================
           CARD
        ========================= */

        .card {
            max-width: 600px;

            margin-top: 25px;
            padding: 25px;

            background: #071310;

            border: 1px solid #12483e;
            border-radius: 8px;

            box-shadow:
                0 0 20px rgba(0, 230, 168, 0.05);
        }

        .card h2 {
            margin-top: 0;

            color: #9ddace;

            font-size: 15px;
            letter-spacing: 1px;
        }

        /* =========================
           BUTTON
        ========================= */

        .button {
            display: block;

            width: 100%;

            margin-top: 12px;
            padding: 14px;

            text-align: center;
            text-decoration: none;

            border-radius: 5px;

            font-size: 13px;
            font-weight: bold;

            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);

            opacity: 0.85;
        }

        /* YOUTUBE */

        .youtube {
            background: #ff0000;
            color: white;
        }

        /* FACEBOOK */

        .facebook {
            background: #1877f2;
            color: white;
        }

        /* GOOGLE */

        .google {
            background: #ffffff;
            color: #222222;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 30px;

            color: #456e64;

            font-size: 11px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .dashboard {
                padding: 15px;
            }

            .header {
                padding: 12px;
            }

            .logo {
                font-size: 14px;
            }

            .title h1 {
                font-size: 20px;
            }

            .card {
                padding: 18px;
            }

        }
    </style>
</head>


<body>

    <div class="dashboard">

        <!-- =========================
             HEADER
        ========================= -->

        <div class="header">

            <div class="logo">
                SYSTEM.CORE
            </div>

            <div class="status">
                ONLINE
            </div>

        </div>


        <!-- =========================
             TITLE
        ========================= -->

        <div class="title">

            <h1>
                SYSTEM OVERVIEW
            </h1>

            <p>
                Simple Dashboard
            </p>

        </div>


        <!-- =========================
             DIRECT LINK CARD
        ========================= -->

        <div class="card">

            <h2>
                DIRECT LINK
            </h2>


            <!-- YOUTUBE -->

            <a
                class="button youtube"
                href="https://www.youtube.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                BUKA YOUTUBE
            </a>


            <!-- FACEBOOK -->

            <a
                class="button facebook"
                href="https://www.facebook.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                BUKA FACEBOOK
            </a>


            <!-- GOOGLE -->

            <a
                class="button google"
                href="https://www.google.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                BUKA GOOGLE
            </a>

        </div>


        <!-- =========================
             FOOTER
        ========================= -->

        <div class="footer">

            SYSTEM.CORE • DASHBOARD v1.0

        </div>

    </div>


</body>
</html>
