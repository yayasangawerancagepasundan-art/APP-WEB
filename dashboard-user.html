<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Dashboard User</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#fff;
  overflow-x:hidden;
}

/* ================= WAVE ================= */
.wave{
  position:fixed;
  bottom:-50px;
  left:0;
  width:200%;
  height:220px;
  border-radius:45%;
  animation:waveMove 12s linear infinite;
  z-index:0;
}

.wave:nth-child(1){background:#ff0000;opacity:0.9;}
.wave:nth-child(2){background:#ff1a1a;opacity:0.7;animation-duration:14s;}
.wave:nth-child(3){background:#ff3333;opacity:0.5;animation-duration:16s;}
.wave:nth-child(4){background:#ff6666;opacity:0.35;animation-duration:18s;}
.wave:nth-child(5){background:#ff9999;opacity:0.25;animation-duration:20s;}

@keyframes waveMove{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

/* ================= HEADER ================= */
.header{
  padding:20px;
  position:relative;
  z-index:2;
}

.logo{
  position:absolute;
  top:15px;
  left:15px;
}

.logo img{
  width:140px;
}

.user-photo{
  position:absolute;
  top:15px;
  right:15px;
}

.user-photo img{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
}

/* ================= GREETING ================= */
.greet{
  margin-top:70px;
  padding:0 10px;
}

.greet p{
  color:#888;
  font-size:13px;
}

.greet h2{
  font-size:20px;
}

/* ================= INFO ================= */
.info-box{
  margin-top:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.info-item{
  background:#fff;
  padding:12px 15px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.06);
  font-size:13px;
}

/* ================= BUTTON ================= */
.btn{
  margin-top:15px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:15px;
  background:linear-gradient(135deg,#ff0000,#ff4d4d);
  color:#fff;
  font-weight:600;
  font-size:14px;
}

.btn-row{
  display:flex;
  gap:10px;
}

.btn-row .btn{
  flex:1;
}

/* ================= LOADING ================= */
.loading{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.loading-box{
  text-align:center;
}

.loading-text span{
  display:inline-block;
  font-weight:600;
  color:#ff0000;
  font-size:16px;
  opacity:0;
  animation:fadeSlide 1.5s infinite;
}

.loading-text span:nth-child(1){animation-delay:0s;}
.loading-text span:nth-child(2){animation-delay:0.1s;}
.loading-text span:nth-child(3){animation-delay:0.2s;}
.loading-text span:nth-child(4){animation-delay:0.3s;}
.loading-text span:nth-child(5){animation-delay:0.4s;}
.loading-text span:nth-child(6){animation-delay:0.5s;}
.loading-text span:nth-child(7){animation-delay:0.6s;}
.loading-text span:nth-child(8){animation-delay:0.7s;}
.loading-text span:nth-child(9){animation-delay:0.8s;}
.loading-text span:nth-child(10){animation-delay:0.9s;}
.loading-text span:nth-child(11){animation-delay:1s;}
.loading-text span:nth-child(12){animation-delay:1.1s;}

@keyframes fadeSlide{
  0%{opacity:0; transform:translateX(20px);}
  50%{opacity:1; transform:translateX(0);}
  100%{opacity:0; transform:translateX(-10px);}
}

/* ================= POPUP ================= */
.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.3);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  opacity:0;
  pointer-events:none;
  transition:0.3s;
}

.popup.show{
  opacity:1;
  pointer-events:auto;
}

.popup-box{
  background:#fff;
  padding:25px;
  border-radius:20px;
  text-align:center;
  width:80%;
  max-width:300px;
  transform:scale(0.8);
  transition:0.3s;
}

.popup.show .popup-box{
  transform:scale(1);
}

.popup-icon{
  width:60px;
  height:60px;
  margin:0 auto 10px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  color:#fff;
}

.success{ background:linear-gradient(45deg,#00c853,#69f0ae); }
.error{ background:linear-gradient(45deg,#ff0000,#ff4d4d); }
.warning{ background:linear-gradient(45deg,#ff9800,#ffc107); }

.popup-msg{
  font-weight:600;
}

</style>
</head>

<body>

<!-- WAVE -->
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>

<!-- HEADER -->
<div class="header">

  <div class="logo">
    <img src="logo.png">
  </div>

  <div class="user-photo">
    <img id="fotoUser" src="">
  </div>

  <div class="greet">
    <p>Selamat Datang</p>
    <h2 id="namaUser">-</h2>
  </div>

  <div class="info-box">
    <div class="info-item">Posisi: <b id="posisi">-</b></div>
    <div class="info-item">Perusahaan: <b id="perusahaan">-</b></div>
    <div class="info-item">Sisa Kontrak: <b id="lama">-</b></div>
    <div class="info-item">Periode: <b id="kontrak">-</b></div>
  </div>

  <button class="btn" onclick="goAbsen()">ABSEN</button>

  <div class="btn-row">
    <button class="btn" onclick="goLembur()">LEMBUR</button>
    <button class="btn" onclick="goKet()">KETERANGAN</button>
  </div>

</div>

<!-- LOADING -->
<div class="loading" id="loading">
  <div class="loading-box">
    <div class="loading-text">
      <span>H</span><span>A</span><span>R</span><span>A</span><span>P</span>
      <span> </span>
      <span>T</span><span>U</span><span>N</span><span>G</span><span>G</span><span>U</span>
    </div>
  </div>
</div>

<!-- POPUP -->
<div id="popup" class="popup">
  <div class="popup-box">
    <div id="popupIcon" class="popup-icon">✓</div>
    <div id="popupMsg" class="popup-msg">Message</div>
  </div>
</div>

<script>

/* ================= CONFIG ================= */
const URL = "https://dashboard-user.yayasangawerancagepasundan.workers.dev/";

/* ================= LOGIN CHECK ================= */
let raw = localStorage.getItem("user");

if(!raw){
  alert("Silahkan login dulu!");
  location.href="index.html";
}

let userLogin = JSON.parse(raw);
let user = {};

/* ================= POPUP ================= */
function showPopup(type, message, duration=1500){
  const popup = document.getElementById("popup");
  const icon = document.getElementById("popupIcon");
  const msg = document.getElementById("popupMsg");

  msg.innerText = message;
  icon.className = "popup-icon " + type;

  if(type==="success") icon.innerText="✓";
  if(type==="error") icon.innerText="✕";
  if(type==="warning") icon.innerText="!";

  popup.classList.add("show");

  setTimeout(()=>{
    popup.classList.remove("show");
  },duration);
}

/* ================= LOAD USER ================= */
async function loadUser(){

  document.getElementById("loading").style.display="flex";

  try{

    let res = await fetch(URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        action:"get_user",
        username:userLogin.username,
        device_id:userLogin.device_id
      })
    });

    let data = await res.json();

    document.getElementById("loading").style.display="none";

    if(data.status==="ok"){
      user = data.data;
      updateDashboard();
    }else{
      showPopup("error",data.msg||"Gagal ambil data");
    }

  }catch(e){
    document.getElementById("loading").style.display="none";
    showPopup("error","Koneksi gagal");
  }
}

/* ================= UPDATE UI ================= */
function updateDashboard(){

  document.getElementById("namaUser").innerText = user.nama || "-";
  document.getElementById("posisi").innerText = user.posisi || "-";
  document.getElementById("perusahaan").innerText = user.perusahaan || "-";

  // FOTO
  let foto = user.foto || "";
  if(!foto){
    foto = "https://ui-avatars.com/api/?name="+encodeURIComponent(user.nama||"User");
  }
  document.getElementById("fotoUser").src = foto;

  // KONTRAK
  let now = new Date();
  let mulai = new Date(user.kontrak_mulai);
  let selesai = new Date(user.kontrak_selesai);

  if(!isNaN(selesai)){
    let sisa = Math.ceil((selesai-now)/(1000*60*60*24));
    document.getElementById("lama").innerText = sisa>0 ? sisa+" Hari" : "Habis";
  }

  function f(t){
    let d=new Date(t);
    return isNaN(d)?"-":d.toLocaleDateString("id-ID");
  }

  document.getElementById("kontrak").innerText =
    f(user.kontrak_mulai)+" - "+f(user.kontrak_selesai);
}

/* ================= NAVIGATION ================= */
function goAbsen(){
  location.href="gps.html";
}

function goLembur(){
  location.href="lembur.html";
}

function goKet(){
  location.href="keterangan.html";
}

/* ================= INIT ================= */
loadUser();

</script>

</body>
</html>
