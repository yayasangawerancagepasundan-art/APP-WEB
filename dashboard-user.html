<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Dashboard User</title>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#fff;
  overflow-x:hidden;
}

/* ================= WAVE BACKGROUND ================= */
.wave{
  position:fixed;
  bottom:-50px;
  left:0;
  width:200%;
  height:220px;
  border-radius:45%;
  animation:waveMove 12s linear infinite;
  z-index:0;
}

/* 5 LAYER */
.wave:nth-child(1){background:#ff0000;opacity:0.9;}
.wave:nth-child(2){background:#ff1a1a;opacity:0.7;animation-duration:14s;}
.wave:nth-child(3){background:#ff3333;opacity:0.5;animation-duration:16s;}
.wave:nth-child(4){background:#ff6666;opacity:0.35;animation-duration:18s;}
.wave:nth-child(5){background:#ff9999;opacity:0.25;animation-duration:20s;}

@keyframes waveMove{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

/* ================= PAGE ================= */
.page{
  display:none;
  padding:80px 20px 90px;
  position:relative;
  z-index:2;
}

.page.active{
  display:block;
}

/* ================= HEADER ================= */
.logo{
  position:absolute;
  top:15px;
  left:15px;
}
.logo img{
  width:170px;
  max-width:70%;
}
}

.header h3{
  font-size:13px;
  color:#888;
}

.header h2{
  font-size:22px;
  margin-bottom:20px;
}

/* ================= DASHBOARD ================= */
.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  text-align:center;
}

/* ================= BUTTON ================= */
.btn{
  margin-top:20px;
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  background:linear-gradient(135deg,#ff0000,#ff4d4d);
  color:#fff;
  font-weight:600;
}

/* ================= NAV ================= */
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  height:65px;
  background:#fff;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -5px 20px rgba(0,0,0,0.08);
  z-index:3;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#888;
  cursor:pointer;
}

.nav-item.active{
  color:#ff0000;
}

.loading{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
  text-align:center;
}

.loading-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.loading-logo{
  width:120px;
  margin-bottom:15px;
}

</style>
</head>

<body>

<!-- ================= WAVE ================= -->
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>

<!-- ================= HOME ================= -->
<div class="page active" id="home">

  <!-- LOGO -->
  <div class="logo">
    <img src="jelas.png">
  </div>

  <!-- HEADER -->
  <div class="header">
    <h3>Selamat Datang 👋</h3>
    <h2 id="namaUser">-</h2>
  </div>

  <!-- DASHBOARD -->
  <div class="menu">
  <div class="card">
  <small>Sisa Kontrak</small>
  <div>⏳ <b id="lama">0 Hari</b></div>
  </div>

  <div class="card">
  <small>Posisi</small>
  <div>👷 <b id="posisi">-</b></div>
  </div>

  <div class="card">
  <small>Perusahaan</small>
  <div>🏢 <b id="perusahaan">-</b></div>
  </div>

  <div class="card">
  <small>Masa Kontrak</small>
  <div>📅 <b id="kontrak">-</b></div>
  </div>

  <!-- BUTTON ABSEN -->
  <button class="btn" onclick="handleAbsen()">ABSEN</button>
  
  <!-- BUTTON LEMBUR -->
  <button class="btn" onclick="handleLembur()">LEMBUR</button>

  <!-- BUTTON KETERANGAN -->
  <button class="btn" onclick="handleKeterangan()">KETERANGAN</button>
  
</div>

<!-- ================= NAV ================= -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="goPage('home',this)">🏠 Home</div>
</div>

<!-- ================= ANIMASI LOADING GPS ================= -->  
  <div class="loading" id="loadingGPS">
  <div class="loading-box">
    <img src="logo.png" class="loading-logo">
    
    <div class="loading-text">
      <span>Harap tunggu...</span>
    </div>

    <div id="gpsInfo" style="margin-top:10px; font-size:14px; color:#555;">
      <div id="statusGPS">Mencari lokasi...</div>
      <div id="akurasi"></div>
      <div id="jarak"></div>
    </div>

  </div>
</div>

<script>

/* ================= CONFIG ================= */
const URL = "https://script.google.com/macros/s/AKfycbwkBKSS5jSOqzlbX0uyBMR4BWREwOVSQRHDwY5TM2naZ-MMkBeXmREIdDV3AxgVuqH8/exec";

/* ================= CEK LOGIN ================= */
let raw = localStorage.getItem("userLogin");

if(!raw){
  alert("Silahkan login dulu!");
  window.location.href = "index.html";
}

let parsed;
try{
  parsed = JSON.parse(raw);
}catch(e){
  alert("Session rusak, login ulang");
  localStorage.removeItem("userLogin");
  location.href="index.html";
}

let user = parsed.user || parsed;
console.log(user);

/* ================= NAVIGASI ================= */
function goPage(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
}

/* ================= UPDATE DASHBOARD ================= */
function updateDashboard(){

  document.getElementById("namaUser").innerText = user.nama || "-";
  document.getElementById("posisi").innerText = user.posisi || "-";
  document.getElementById("perusahaan").innerText = user.perusahaan || "-";

  let now = new Date();

  let mulai = user.kontrak_mulai ? new Date(user.kontrak_mulai) : null;
  let selesai = user.kontrak_selesai ? new Date(user.kontrak_selesai) : null;

  let validMulai = mulai && !isNaN(mulai);
  let validSelesai = selesai && !isNaN(selesai);

  // ================= SISA KONTRAK =================
  if(validSelesai){

    let sisa = Math.ceil((selesai - now)/(1000*60*60*24));

    if(sisa > 0){
      document.getElementById("lama").innerText = sisa + " Hari";
    }else if(sisa === 0){
      document.getElementById("lama").innerText = "Hari Terakhir";
    }else{
      document.getElementById("lama").innerText = "Habis";
    }

  }else{
    document.getElementById("lama").innerText = "0 Hari";
  }

  // ================= FORMAT =================
  function format(t){
    let d = new Date(t);
    if(isNaN(d)) return "-";
    return d.toLocaleDateString("id-ID");
  }

  // ================= TANGGAL =================
  if(validMulai && validSelesai){
    document.getElementById("kontrak").innerText =
      format(user.kontrak_mulai) + " - " + format(user.kontrak_selesai);
  }else{
    document.getElementById("kontrak").innerText = "-";
  }

}

/* ================= PANGGIL ================= */
updateDashboard();
/* ================= ABSEN ================= */
function handleAbsen(){

  const loading = document.getElementById("loadingGPS");

  loading.style.display = "flex";
  document.getElementById("statusGPS").innerText = "Mengambil lokasi...";

  navigator.geolocation.getCurrentPosition(pos=>{

    document.getElementById("statusGPS").innerText = "Mengirim data...";

    fetch(URL,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        action:"absen",
        username:user.username,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(()=>{
      loading.style.display = "none";
      alert("Absen terkirim (cek server)");
    })
    .catch(err=>{
      loading.style.display = "none";
      alert("Gagal kirim");
      console.error(err);
    });

  }, err=>{
    loading.style.display = "none";
    alert("GPS gagal: " + err.message);
  },{
    enableHighAccuracy:true,
    timeout:15000,
    maximumAge:0
  });

}
  
let lemburAktif = false;
let trackingInterval = null;

function handleLembur(){

  navigator.geolocation.getCurrentPosition(pos=>{

    fetch(URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        action:"lembur",
        username:user.username,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(res=>res.json())
    .then(res=>{

      alert(res.msg);

      if(res.status == "start_lembur"){
        lemburAktif = true;

        if(trackingInterval) clearInterval(trackingInterval);

        trackingInterval = setInterval(()=>{
          kirimTracking();
        },600000);
      }

      if(res.status == "stop_lembur"){
        lemburAktif = false;

        clearInterval(trackingInterval);
      }

    });

  });

}

function handleKeterangan(){

  let ket = prompt(`Pilih Keterangan:
1. SAKIT
2. IZIN
3. CUTI
4. DINAS`);

  let map = {
    "1":"SAKIT",
    "2":"IZIN",
    "3":"CUTI",
    "4":"DINAS",
  };

  if(!map[ket]) return alert("Pilihan tidak valid");

  navigator.geolocation.getCurrentPosition(pos=>{

    fetch(URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        action:"keterangan",
        username:user.username,
        jenis:map[ket],
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(res=>res.json())
    .then(res=>{
      alert(res.msg || "Berhasil");
    });

  });

}

//tracking

function kirimTracking(){

  navigator.geolocation.getCurrentPosition(pos=>{

    if(pos.coords.accuracy > 100){
      console.log("Akurasi jelek, skip");
      return;
    }

    fetch(URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        action:"tracking",
        username:user.username,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude,
        acc:pos.coords.accuracy
      })
    });

    console.log("Tracking lembur terkirim");

  });

}
  
</script>

</body>
</html>
