<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard User</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#fff;
  overflow-x:hidden;
}

/* ================= WAVE ================= */
.wave{
  position:fixed;
  bottom:-120px;
  left:0;
  width:200%;
  height:180px;
  border-radius:45%;
  animation:waveMove 12s linear infinite;
  z-index:0;
}
.wave:nth-child(1){background:#ff0000;opacity:0.9;}
.wave:nth-child(2){background:#ff1a1a;opacity:0.7;animation-duration:14s;}
.wave:nth-child(3){background:#ff3333;opacity:0.5;animation-duration:16s;}
.wave:nth-child(4){background:#ff6666;opacity:0.35;animation-duration:18s;}
.wave:nth-child(5){background:#ff9999;opacity:0.25;animation-duration:20s;}

@keyframes waveMove{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

/* ================= TOPBAR ================= */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
  position:relative;
  z-index:2;
}

.logo img{
  width:150px;
}

/* FOTO */
.avatar{
  width:72px;
  height:72px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #fff;
  box-shadow:0 8px 20px rgba(0,0,0,0.18);
}

/* ================= WELCOME ================= */
.welcome{
  padding:0 20px;
  margin-top:5px;
  position:relative;
  z-index:2;
}

.welcome h4{
  font-size:13px;
  color:#888;
}

.welcome h2{
  font-size:22px;
  font-weight:600;
}

/* ================= CARD ================= */
.card{
  background:#fff;
  margin:20px;
  padding:20px;
  border-radius:20px;
  box-shadow:0 12px 30px rgba(0,0,0,0.08);
  border:1px solid rgba(0,0,0,0.03);
  position:relative;
  z-index:2;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.left{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon{
  width:18px;
  height:18px;
  fill:#999;
}

.label{
  font-size:13px;
  color:#777;
}

.value{
  font-size:14px;
  font-weight:600;
  text-align:right;
  max-width:55%;
  word-break:break-word;
}

.value.small{
  font-size:12px;
}

/* ================= BUTTON ================= */
.btn{
  margin:10px 20px;
  width:calc(100% - 40px);
  padding:15px;
  border:none;
  border-radius:15px;
  background:linear-gradient(135deg,#ff0000,#ff4d4d);
  color:#fff;
  font-weight:600;
  box-shadow:0 6px 15px rgba(255,0,0,0.25);
  transition:0.2s;
  position:relative;
  z-index:2;
}

.btn:active{
  transform:scale(0.96);
}

.row-btn{
  display:flex;
  gap:10px;
  margin:10px 20px;
}

.btn.half{
  width:100%;
  margin:0;
}

/* ================= LOADING ================= */
.loading{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.loading-text span{
  display:inline-block;
  font-weight:600;
  color:#ff0000;
  font-size:16px;
  opacity:0;
  animation:fadeSlide 1.5s infinite;
}

.loading-text span:nth-child(1){animation-delay:0s;}
.loading-text span:nth-child(2){animation-delay:0.1s;}
.loading-text span:nth-child(3){animation-delay:0.2s;}
.loading-text span:nth-child(4){animation-delay:0.3s;}
.loading-text span:nth-child(5){animation-delay:0.4s;}
.loading-text span:nth-child(6){animation-delay:0.5s;}
.loading-text span:nth-child(7){animation-delay:0.6s;}
.loading-text span:nth-child(8){animation-delay:0.7s;}
.loading-text span:nth-child(9){animation-delay:0.8s;}
.loading-text span:nth-child(10){animation-delay:0.9s;}
.loading-text span:nth-child(11){animation-delay:1s;}
.loading-text span:nth-child(12){animation-delay:1.1s;}

@keyframes fadeSlide{
  0%{opacity:0; transform:translateX(20px);}
  50%{opacity:1; transform:translateX(0);}
  100%{opacity:0; transform:translateX(-10px);}
}
</style>
</head>

<body>

<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>

<div class="topbar">
  <div class="logo">
    <img src="jelas.png">
  </div>
  <img id="fotoUser" class="avatar">
</div>

<div class="welcome">
  <h4>Selamat Datang</h4>
  <h2 id="namaUser">-</h2>
</div>

<div class="card">

  <div class="row">
    <div class="left">
      <svg class="icon" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 20c0-4 16-4 16 0"></path>
      </svg>
      <div class="label">Posisi</div>
    </div>
    <div class="value" id="posisi">-</div>
  </div>

  <div class="row">
    <div class="left">
      <svg class="icon" viewBox="0 0 24 24">
        <rect x="3" y="10" width="18" height="10"></rect>
        <rect x="7" y="4" width="10" height="6"></rect>
      </svg>
      <div class="label">Perusahaan</div>
    </div>
    <div class="value" id="perusahaan">-</div>
  </div>

  <div class="row">
    <div class="left">
      <svg class="icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 7v6l4 2"></path>
      </svg>
      <div class="label">Sisa Kontrak</div>
    </div>
    <div class="value" id="lama">-</div>
  </div>

  <div class="row">
    <div class="left">
      <svg class="icon" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="16"></rect>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <div class="label">Periode</div>
    </div>
    <div class="value" id="kontrak">-</div>
  </div>

</div>

<button class="btn" onclick="goAbsen()">ABSEN</button>

<div class="row-btn">
  <button class="btn half" onclick="goLembur()">LEMBUR</button>
  <button class="btn half" onclick="goKet()">KETERANGAN</button>
</div>

<div class="loading" id="loading">
  <div class="loading-text">
    <span>H</span><span>A</span><span>R</span><span>A</span><span>P</span>
    <span> </span>
    <span>T</span><span>U</span><span>N</span><span>G</span><span>G</span><span>U</span>
  </div>
</div>

<script>
const URL = "https://dashboard-user.yayasangawerancagepasundan.workers.dev/";

let userLogin = JSON.parse(localStorage.getItem("user") || "{}");
let user = {};

function showLoad(){ document.getElementById("loading").style.display="flex"; }
function hideLoad(){ document.getElementById("loading").style.display="none"; }

function fixFotoURL(url, nama){
  if(!url || typeof url !== "string"){
    return "https://ui-avatars.com/api/?name="+encodeURIComponent(nama||"User");
  }
  try{
    let safe = encodeURI(url.trim());
    if(!safe.startsWith("http")) throw "invalid";
    return safe;
  }catch(e){
    return "https://ui-avatars.com/api/?name="+encodeURIComponent(nama||"User");
  }
}

function autoSizeText(el){
  if(el.innerText.length > 25){
    el.classList.add("small");
  }
}

function formatTanggal(t){
  let d = new Date(t);
  if(isNaN(d)) return "-";
  return d.toLocaleDateString("id-ID");
}

async function loadUser(){
  showLoad();

  try{
    let res = await fetch(URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        action:"get_user",
        username:userLogin.username,
        device_id:userLogin.device_id
      })
    });

    let data = await res.json();

    if(data.status === "ok"){
      user = data.data;

      document.getElementById("namaUser").innerText = user.nama || "-";
      document.getElementById("posisi").innerText = user.posisi || "-";
      document.getElementById("perusahaan").innerText = user.perusahaan || "-";

      let foto = fixFotoURL(user.foto, user.nama);
      let img = document.getElementById("fotoUser");

      img.src = foto;
      img.onerror = function(){
        this.src = "https://ui-avatars.com/api/?name="+encodeURIComponent(user.nama);
      };

      let now = new Date();
      let selesai = new Date(user.kontrak_selesai || now);
      let sisa = Math.ceil((selesai-now)/(1000*60*60*24));

      document.getElementById("lama").innerText =
        sisa > 0 ? sisa+" Hari" : "Habis";

      document.getElementById("kontrak").innerText =
        formatTanggal(user.kontrak_mulai) + " - " +
        formatTanggal(user.kontrak_selesai);

      autoSizeText(document.getElementById("perusahaan"));
      autoSizeText(document.getElementById("kontrak"));
    }

  }catch(e){
    alert("Gagal load user");
  }

  hideLoad();
}

function goAbsen(){
  showLoad();
  setTimeout(()=>{ location.href="gps.html"; },800);
}

function goLembur(){
  showLoad();
  setTimeout(()=>{ location.href="lembur.html"; },800);
}

function goKet(){
  showLoad();
  setTimeout(()=>{ location.href="keterangan.html"; },800);
}

loadUser();
</script>

</body>
</html>
