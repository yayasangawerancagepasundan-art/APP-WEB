<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App LPK Gyokai</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
  background:#fff;
  overflow-x:hidden;
}

/* WAVES */
.wave{
  position:fixed;
  bottom:-50px;
  left:0;
  width:200%;
  height:220px;
  border-radius:45%;
  animation:waveMove 12s linear infinite;
  z-index:0;
}

.wave:nth-child(1){background:#ff0000;opacity:0.9;}
.wave:nth-child(2){background:#ff1a1a;opacity:0.7;animation-duration:14s;}
.wave:nth-child(3){background:#ff3333;opacity:0.5;animation-duration:16s;}
.wave:nth-child(4){background:#ff6666;opacity:0.35;animation-duration:18s;}
.wave:nth-child(5){background:#ff9999;opacity:0.25;animation-duration:20s;}

@keyframes waveMove{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

/* PAGE */
.page{
  display:none;
  padding:80px 20px 90px;
  position:relative;
  z-index:2;
  animation:fade 0.3s;
}

.page.active{
  display:block;
}

@keyframes fade{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

/* LOGO */
.logo{
  position:absolute;
  top:15px;
  left:15px;
}
.logo img{
  width:45px;
}

/* HEADER */
.header h3{font-size:13px;color:#888;}
.header h2{font-size:22px;margin-bottom:20px;}

/* MENU */
.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  text-align:center;
}

.card b{
  display:block;
  margin-top:5px;
}

/* BUTTON */
.logout{
  margin-top:20px;
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  background:linear-gradient(135deg,#ff0000,#ff4d4d);
  color:#fff;
  font-weight:600;
}

/* NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  height:65px;
  background:#fff;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -5px 20px rgba(0,0,0,0.08);
  z-index:3;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#888;
  cursor:pointer;
}

.nav-item.active{color:#ff0000;}

.nav-icon{font-size:20px;}
</style>
</head>

<body>

<!-- WAVES -->
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>

<!-- HOME -->
<div class="page active" id="home">

  <div class="logo">
    <img src="jelas.png">
  </div>

  <div class="header">
    <h3>Selamat Datang 👋</h3>
    <h2>User LPK Gyokai</h2>
  </div>

  <div class="menu">
    <div class="card">⏳ <b id="lama">0 Hari</b></div>
    <div class="card">👷 <b id="posisi">-</b></div>
    <div class="card">🏢 <b id="perusahaan">-</b></div>
    <div class="card">📅 <b id="kontrak">-</b></div>
  </div>

  <button id="absenBtn" class="logout" onclick="handleAbsen()">ABSEN MASUK</button>

</div>

<!-- LEMBUR -->
<div class="page" id="jadwal">
  <div class="logo"><img src="jelas.png"></div>
  <h2>Lembur</h2>
  <p>Tidak memaksa keluar</p>
</div>

<!-- PROFILE -->
<div class="page" id="profile">
  <div class="logo"><img src="jelas.png"></div>
  <h2>Profile</h2>
</div>

<!-- NAV -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="goPage('home',this)">
    <div class="nav-icon">🏠</div>Home
  </div>
  <div class="nav-item" onclick="goPage('jadwal',this)">
    <div class="nav-icon">🔥</div>Lembur
  </div>
  <div class="nav-item" onclick="goPage('profile',this)">
    <div class="nav-icon">👤</div>Profile
  </div>
</div>

<script>

// ===== NAV =====
function goPage(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
}

// ===== DATA USER SIMULASI =====
let user = {
  posisi:"Operator",
  perusahaan:"PT Epson Batam",
  mulai:"2026-09-01",
  kontrak:"2026-12-01"
};

// ===== HITUNG HARI =====
function hari(t){
  return Math.floor((new Date()-new Date(t))/(1000*60*60*24));
}

function updateDashboard(){
  document.getElementById("lama").innerText = hari(user.mulai)+" Hari";
  document.getElementById("posisi").innerText = user.posisi;
  document.getElementById("perusahaan").innerText = user.perusahaan;
  document.getElementById("kontrak").innerText = hari(user.kontrak)+" Hari";
}

updateDashboard();

// ===== ABSEN + GPS =====
let kantor={lat:1.1305,lng:104.0530,radius:200};

let status="KELUAR";
let lastMasuk=0;
let lastKeluar=0;
let jamPulang=17;
let proses=false;

// JARAK
function jarak(a,b,c,d){
  let R=6371e3;
  let dLat=(c-a)*Math.PI/180;
  let dLon=(d-b)*Math.PI/180;
  let x=Math.sin(dLat/2)**2+
        Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
        Math.sin(dLon/2)**2;
  return R*(2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)));
}

// UPDATE BUTTON
function updateBtn(){
  let btn=document.getElementById("absenBtn");
  let now=new Date();
  if(status==="MASUK" && (now.getHours()>17 || (now.getHours()==17 && now.getMinutes()>=15))){
    status="KELUAR";
    alert("Auto keluar");
  }
  btn.innerText = status==="KELUAR"?"ABSEN MASUK":"ABSEN KELUAR";
}

setInterval(updateBtn,1000);

// HANDLE ABSEN
function handleAbsen(){

  if(proses) return;
  proses=true;

  let btn=document.getElementById("absenBtn");
  btn.innerText="⏳ Memproses...";
  btn.disabled=true;

  navigator.geolocation.getCurrentPosition(pos=>{

    let acc=pos.coords.accuracy;
    let j=jarak(pos.coords.latitude,pos.coords.longitude,kantor.lat,kantor.lng);

    // ANTI FAKE
    if(acc>100){
      alert("GPS tidak valid!");
      return reset();
    }

    if(j>kantor.radius){
      alert("Diluar area!");
      return reset();
    }

    let now=Date.now();

    if(status==="KELUAR"){
      if(now-lastKeluar<600000) return alert("Tunggu 10 menit"),reset();
      status="MASUK"; lastMasuk=now;
      alert("MASUK berhasil");
    }else{
      if(now-lastMasuk<3600000) return alert("Minimal 1 jam"),reset();
      status="KELUAR"; lastKeluar=now;
      alert("KELUAR berhasil");
    }

    reset();

  },()=>{
    alert("GPS gagal");
    reset();
  },{enableHighAccuracy:true});

}

function reset(){
  proses=false;
  let btn=document.getElementById("absenBtn");
  btn.disabled=false;
  updateBtn();
}

</script>

</body>
</html>
