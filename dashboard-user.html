<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard User</title>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#fff;
  overflow-x:hidden;
}

/* ================= WAVE BACKGROUND ================= */
.wave{
  position:fixed;
  bottom:-50px;
  left:0;
  width:200%;
  height:220px;
  border-radius:45%;
  animation:waveMove 12s linear infinite;
  z-index:0;
}

/* 5 LAYER */
.wave:nth-child(1){background:#ff0000;opacity:0.9;}
.wave:nth-child(2){background:#ff1a1a;opacity:0.7;animation-duration:14s;}
.wave:nth-child(3){background:#ff3333;opacity:0.5;animation-duration:16s;}
.wave:nth-child(4){background:#ff6666;opacity:0.35;animation-duration:18s;}
.wave:nth-child(5){background:#ff9999;opacity:0.25;animation-duration:20s;}

@keyframes waveMove{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

/* ================= PAGE ================= */
.page{
  display:none;
  padding:80px 20px 90px;
  position:relative;
  z-index:2;
}

.page.active{
  display:block;
}

/* ================= HEADER ================= */
.logo{
  position:absolute;
  top:15px;
  left:15px;
}
.logo img{
  width:170px;
  max-width:70%;
}
}

.header h3{
  font-size:13px;
  color:#888;
}

.header h2{
  font-size:22px;
  margin-bottom:20px;
}

/* ================= DASHBOARD ================= */
.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  text-align:center;
}

/* ================= BUTTON ================= */
.btn{
  margin-top:20px;
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  background:linear-gradient(135deg,#ff0000,#ff4d4d);
  color:#fff;
  font-weight:600;
}

/* ================= NAV ================= */
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  height:65px;
  background:#fff;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -5px 20px rgba(0,0,0,0.08);
  z-index:3;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#888;
  cursor:pointer;
}

.nav-item.active{
  color:#ff0000;
}

</style>
</head>

<body>

<!-- ================= WAVE ================= -->
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>

<!-- ================= HOME ================= -->
<div class="page active" id="home">

  <!-- LOGO -->
  <div class="logo">
    <img src="jelas.png">
  </div>

  <!-- HEADER -->
  <div class="header">
    <h3>Selamat Datang 👋</h3>
    <h2 id="namaUser">-</h2>
  </div>

  <!-- DASHBOARD -->
  <div class="menu">
    <div class="card">⏳ <b id="lama">0 Hari</b></div>
    <div class="card">👷 <b id="posisi">-</b></div>
    <div class="card">🏢 <b id="perusahaan">-</b></div>
    <div class="card">📅 <b id="kontrak">-</b></div>
  </div>

  <!-- BUTTON ABSEN -->
  <button class="btn" onclick="handleAbsen()">ABSEN</button>
  
  <!-- BUTTON LEMBUR -->
  <button class="btn" onclick="handleLembur()" style="background:#333;">
  LEMBUR
</button>

  <!-- BUTTON KETERANGAN -->
  <button class="btn" onclick="handleKeterangan()" style="background:#555;">
  KETERANGAN
</button>

</div>

<!-- ================= NAV ================= -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="goPage('home',this)">🏠 Home</div>
</div>

<script>

/* ================= CONFIG ================= */
const URL = "https://script.google.com/macros/s/AKfycbyYF0eRDBsxl8Nyg9L0fEFlJj8KCUF-KZVLp5xqVtd00NT8kn401gGrbAZfboUaj3YF/exec";

/* ================= CEK LOGIN ================= */
let user = JSON.parse(localStorage.getItem("userLogin"));

if(!user){
  alert("Silahkan login dulu!");
  window.location.href = "index.html";
}

/* ================= NAVIGASI ================= */
function goPage(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
}

/* ================= HITUNG HARI ================= */
function hari(tanggal){
  return Math.floor((new Date()-new Date(tanggal))/(1000*60*60*24));
}

/* ================= UPDATE DASHBOARD ================= */
function updateDashboard(){

  // ambil dari login Apps Script
  document.getElementById("namaUser").innerText = user.nama || "-";
  document.getElementById("posisi").innerText = user.posisi || "-";
  document.getElementById("perusahaan").innerText = user.perusahaan || "-";

  // kalau belum ada tanggal
  document.getElementById("lama").innerText = "0 Hari";
  document.getElementById("kontrak").innerText = "-";
}

updateDashboard();

/* ================= ABSEN ================= */
function handleAbsen(){

  navigator.geolocation.getCurrentPosition(pos=>{

    fetch(URL,{
      method:"POST",
      body:JSON.stringify({
        action:"absen",
        username:user.username,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(res=>res.json())
    .then(res=>{

      if(res.status=="masuk"){
        alert("Absen MASUK berhasil");
      }
      else if(res.status=="keluar"){
        alert("Absen KELUAR berhasil");
      }
      else{
        alert(res.msg);
      }

    });

  },()=>{
    alert("GPS gagal");
  },{enableHighAccuracy:true});

}

let lemburAktif = false;
let trackingInterval = null;

function handleLembur(){

  navigator.geolocation.getCurrentPosition(pos=>{

    fetch(URL,{
      method:"POST",
      body:JSON.stringify({
        action:"lembur",
        username:user.username,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(res=>res.json())
    .then(res=>{

      alert(res.msg);

      // 🔥 START TRACKING
      if(res.status == "start_lembur"){
        lemburAktif = true;

        trackingInterval = setInterval(()=>{
          kirimTracking();
        },600000); // 10 menit
      }

      // 🔥 STOP TRACKING
      if(res.status == "stop_lembur"){
        lemburAktif = false;

        clearInterval(trackingInterval);
      }

    });

  });

}
function handleKeterangan(){

  let ket = prompt(`Pilih Keterangan:
1. SAKIT
2. IZIN
3. CUTI
4. DINAS`);

  let map = {
    "1":"SAKIT",
    "2":"IZIN",
    "3":"CUTI",
    "4":"DINAS",
  };

  if(!map[ket]) return alert("Pilihan tidak valid");

  navigator.geolocation.getCurrentPosition(pos=>{

    fetch(URL,{
      method:"POST",
      body:JSON.stringify({
        action:"keterangan",

        // 🔥 INI DIA TEMPATNYA
        username:user.username,

        jenis:map[ket],
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(res=>res.json())
    .then(res=>{
      alert(res.msg || "Berhasil");
    });

  });

}

//tracking

function kirimTracking(){

  navigator.geolocation.getCurrentPosition(pos=>{

    // 🔥 filter akurasi jelek
    if(pos.coords.accuracy > 100){
      console.log("Akurasi jelek, skip");
      return;
    }

    fetch(URL,{
      method:"POST",
      body:JSON.stringify({
        action:"tracking",
        username:user.username,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude,
        acc:pos.coords.accuracy
      })
    });

    console.log("Tracking lembur terkirim");

  });

}
  
</script>

</body>
</html>
