<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 🔥 ANTI CACHE -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Dashboard User</title>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#fff;
  overflow-x:hidden;
}

/* ================= WAVE BACKGROUND ================= */
.wave{
  position:fixed;
  bottom:-50px;
  left:0;
  width:200%;
  height:220px;
  border-radius:45%;
  animation:waveMove 12s linear infinite;
  z-index:0;
}

/* 5 LAYER */
.wave:nth-child(1){background:#ff0000;opacity:0.9;}
.wave:nth-child(2){background:#ff1a1a;opacity:0.7;animation-duration:14s;}
.wave:nth-child(3){background:#ff3333;opacity:0.5;animation-duration:16s;}
.wave:nth-child(4){background:#ff6666;opacity:0.35;animation-duration:18s;}
.wave:nth-child(5){background:#ff9999;opacity:0.25;animation-duration:20s;}

@keyframes waveMove{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

/* ================= PAGE ================= */
.page{
  display:none;
  padding:80px 20px 90px;
  position:relative;
  z-index:2;
}

.page.active{
  display:block;
}

/* ================= HEADER ================= */
.logo{
  position:absolute;
  top:15px;
  left:15px;
}

.logo img{
  width:170px;
  max-width:70%;
}

/* 🔥 FIX: tadi error di sini karena kurung kebanyakan */

.header{
  margin-top:60px;
  text-align:center;
}

.header h3{
  font-size:13px;
  color:#888;
}

.header h2{
  font-size:22px;
  margin-bottom:20px;
}

/* ================= DASHBOARD ================= */
.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  text-align:center;
}

/* ================= BUTTON ================= */
.btn{
  margin-top:20px;
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  background:linear-gradient(135deg,#ff0000,#ff4d4d);
  color:#fff;
  font-weight:600;
}

/* ================= NAV ================= */
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  height:65px;
  background:#fff;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -5px 20px rgba(0,0,0,0.08);
  z-index:3;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#888;
  cursor:pointer;
}

.nav-item.active{
  color:#ff0000;
}

/* ================= LOADING ================= */
.loading{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
  text-align:center;
}

.loading-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.loading-logo{
  width:120px;
  margin-bottom:15px;
}

.loading-text span{
  display:inline-block;
  font-weight:600;
  color:#ff0000;
  font-size:16px;
  opacity:0;
  animation:fadeSlide 1.5s infinite;
}

.loading-text span:nth-child(1){animation-delay:0s;}
.loading-text span:nth-child(2){animation-delay:0.1s;}
.loading-text span:nth-child(3){animation-delay:0.2s;}
.loading-text span:nth-child(4){animation-delay:0.3s;}
.loading-text span:nth-child(5){animation-delay:0.4s;}
.loading-text span:nth-child(6){animation-delay:0.5s;}
.loading-text span:nth-child(7){animation-delay:0.6s;}
.loading-text span:nth-child(8){animation-delay:0.7s;}
.loading-text span:nth-child(9){animation-delay:0.8s;}
.loading-text span:nth-child(10){animation-delay:0.9s;}
.loading-text span:nth-child(11){animation-delay:1s;}
.loading-text span:nth-child(12){animation-delay:1.1s;}

@keyframes fadeSlide{
  0%{opacity:0; transform:translateX(20px);}
  50%{opacity:1; transform:translateX(0);}
  100%{opacity:0; transform:translateX(-10px);}
}

  /* ================= TEXT ZOOM ================= */
.zoom-anim{
  animation: zoomInOut 1.5s infinite ease-in-out;
}

@keyframes zoomInOut{
  0%{ transform:scale(0.9); opacity:0.6; }
  50%{ transform:scale(1.2); opacity:1; }
  100%{ transform:scale(0.9); opacity:0.6; }
}

/* ================= RADAR ================= */
.radar{
  position:relative;
  width:200px;
  height:200px;
  margin:15px auto;
}

.circle{
  position:absolute;
  width:100%;
  height:100%;
  border:2px solid rgba(255,0,0,0.3);
  border-radius:50%;
  animation:pulse 2s infinite;
}

.circle:nth-child(2){animation-delay:0.5s;}
.circle:nth-child(3){animation-delay:1s;}

@keyframes pulse{
  0%{ transform:scale(0.5); opacity:1; }
  100%{ transform:scale(1.5); opacity:0; }
}

/* ================= MACAN ================= */
#macan{
  position:absolute;
  width:140px; /* lebih besar */
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  transition:all 0.6s ease;
}

/* ================= JALAN (pelan) ================= */
.jalan{
  animation:jalan 0.8s infinite ease-in-out;
}

/* ================= LARI (cepat) ================= */
.lari{
  animation:lari 0.25s infinite ease-in-out;
}

/* ================= KABUR ================= */
.kabur{
  left:130% !important;
  transform:translateY(-50%) scale(1.1);
  animation:none;
  transition:1s ease-out;
}

/* ================= ANIMASI ================= */

/* jalan kecil (halus) */
@keyframes jalan{
  0%   { transform:translate(-50%,-50%) scale(1); }
  50%  { transform:translate(-47%,-50%) scale(1.04); }
  100% { transform:translate(-50%,-50%) scale(1); }
}

/* lari lebih agresif */
@keyframes lari{
  0%   { transform:translate(-50%,-50%) scale(1); }
  50%  { transform:translate(-38%,-50%) scale(1.1); }
  100% { transform:translate(-50%,-50%) scale(1); }
}

  
/* ================= PROGRESS ================= */
.progress{
  width:80%;
  height:10px;
  background:#ddd;
  border-radius:10px;
  margin:10px auto;
  overflow:hidden;
}

#bar{
  width:0%;
  height:100%;
  background:red;
  transition:0.3s;
}

</style>
</head>
<body>

<!-- ================= WAVE ================= -->
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>

<!-- ================= HOME ================= -->
<div class="page active" id="home">

  <!-- LOGO -->
  <div class="logo">
    <img src="jelas.png">
  </div>

  <!-- HEADER -->
  <div class="header">
    <h3>Selamat Datang 👋</h3>
    <h2 id="namaUser">-</h2>
  </div>

  <!-- DASHBOARD -->
  <div class="menu">
  <div class="card">
  <small>Sisa Kontrak</small>
  <div>⏳ <b id="lama">0 Hari</b></div>
  </div>

  <div class="card">
  <small>Posisi</small>
  <div>👷 <b id="posisi">-</b></div>
  </div>

  <div class="card">
  <small>Perusahaan3</small>
  <div>🏢 <b id="perusahaan">-</b></div>
  </div>

  <div class="card">
  <small>Masa Kontrak</small>
  <div>📅 <b id="kontrak">-</b></div>
  </div>

  <!-- BUTTON ABSEN -->
  <button class="btn" onclick="handleAbsen()">ABSEN</button>
  
  <!-- BUTTON LEMBUR -->
  <button class="btn" onclick="handleLembur()">LEMBUR</button>

  <!-- BUTTON KETERANGAN -->
  <button class="btn" onclick="handleKeterangan()">KETERANGAN</button>
  
</div>

<!-- ================= NAV ================= -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="goPage('home',this)">🏠 Home</div>
</div>

<!-- ================= ANIMASI LOADING GPS ================= -->  
<div class="loading" id="loadingGPS">
  <div class="loading-box">

    <img src="jelas.png" class="loading-logo">

    <div class="loading-text">
      <span>H</span><span>A</span><span>R</span><span>A</span><span>P</span>
      <span>&nbsp;</span>
      <span>T</span><span>U</span><span>N</span><span>G</span><span>G</span><span>U</span>
    </div>

    <!-- TAMBAHAN (LU PUNYA) -->
    <div style="margin-top:10px;font-size:14px;color:#555;">
      
      <!-- 🔥 TAMBAH CLASS -->
      <div id="textStatus" class="zoom-anim">Mencari lokasi...</div>
      <div id="textJarak"></div>
  
      <!-- TARGET AREA -->
      <div class="radar">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>

        <!-- MACAN -->
        <img src="macan.png" id="macan">
      </div>

      <!-- PROGRESS -->
      <div class="progress">
        <div id="bar"></div>
      </div>

      <p id="jarakText">Jarak: - meter</p>

    </div>
  </div>
</div>
<script>

/* ================= CONFIG ================= */
const URL = "https://script.google.com/macros/s/AKfycbwkBKSS5jSOqzlbX0uyBMR4BWREwOVSQRHDwY5TM2naZ-MMkBeXmREIdDV3AxgVuqH8/exec"
/* ================= CEK LOGIN ================= */
let raw = localStorage.getItem("userLogin");

if(!raw){
  alert("Silahkan login dulu!");
  window.location.href = "index.html";
}

let parsed;
try{
  parsed = JSON.parse(raw);
}catch(e){
  alert("Session rusak, login ulang");
  localStorage.removeItem("userLogin");
  location.href="index.html";
}

let user = parsed.user || parsed;
console.log(user);

/* ================= NAVIGASI ================= */
function goPage(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
}

/* ================= UPDATE DASHBOARD ================= */
function updateDashboard(){

  document.getElementById("namaUser").innerText = user.nama || "-";
  document.getElementById("posisi").innerText = user.posisi || "-";
  document.getElementById("perusahaan").innerText = user.perusahaan || "-";

  let now = new Date();

  let mulai = user.kontrak_mulai ? new Date(user.kontrak_mulai) : null;
  let selesai = user.kontrak_selesai ? new Date(user.kontrak_selesai) : null;

  let validMulai = mulai && !isNaN(mulai);
  let validSelesai = selesai && !isNaN(selesai);

  // ================= SISA KONTRAK =================
  if(validSelesai){

    let sisa = Math.ceil((selesai - now)/(1000*60*60*24));

    if(sisa > 0){
      document.getElementById("lama").innerText = sisa + " Hari";
    }else if(sisa === 0){
      document.getElementById("lama").innerText = "Hari Terakhir";
    }else{
      document.getElementById("lama").innerText = "Habis";
    }

  }else{
    document.getElementById("lama").innerText = "0 Hari";
  }

  // ================= FORMAT =================
  function format(t){
    let d = new Date(t);
    if(isNaN(d)) return "-";
    return d.toLocaleDateString("id-ID");
  }

  // ================= TANGGAL =================
  if(validMulai && validSelesai){
    document.getElementById("kontrak").innerText =
      format(user.kontrak_mulai) + " - " + format(user.kontrak_selesai);
  }else{
    document.getElementById("kontrak").innerText = "-";
  }

}

/* ================= PANGGIL ================= */
updateDashboard();
/* ================= ABSEN ================= */
function handleAbsen(){

  const loading = document.getElementById("loadingGPS");
  const textUtama = document.getElementById("textUtama");
  const textStatus = document.getElementById("textStatus");
  const textJarak = document.getElementById("textJarak");

  loading.style.display = "flex";

  navigator.geolocation.watchPosition(pos=>{

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    let jarak = distance(lat, lng, user.lat, user.lng);

    textUtama.innerText = "Harap tunggu...";
    textStatus.innerText = "Mencari lokasi...";
    textJarak.innerText = "Jarak: " + Math.round(jarak) + " meter";

    if(jarak <= user.radius){

      textUtama.innerText = "ANDA DALAM AREA";
      textStatus.innerText = "Mengirim absen...";

      navigator.geolocation.clearWatch(this);

      fetch(URL,{
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body: JSON.stringify({
          action:"absen",
          username:user.username,
          lat:lat,
          lng:lng
        })
      })
      .then(res=>res.text())
      .then(res=>{
        alert(res);
      })
      .finally(()=>{
        loading.style.display = "none";
      });

    }

  }, err=>{
    loading.style.display = "none";
    alert("GPS gagal: " + err.message);
  },{
    enableHighAccuracy:true,
    maximumAge:0
  });

}
  
let lemburAktif = false;
let trackingInterval = null;

function handleLembur(){

  navigator.geolocation.getCurrentPosition(pos=>{

    fetch(URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        action:"lembur",
        username:user.username,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(res=>res.json())
    .then(res=>{

      alert(res.msg);

      if(res.status == "start_lembur"){
        lemburAktif = true;

        if(trackingInterval) clearInterval(trackingInterval);

        trackingInterval = setInterval(()=>{
          kirimTracking();
        },600000);
      }

      if(res.status == "stop_lembur"){
        lemburAktif = false;

        clearInterval(trackingInterval);
      }

    });

  });

}

function handleKeterangan(){

  let ket = prompt(`Pilih Keterangan:
1. SAKIT
2. IZIN
3. CUTI
4. DINAS`);

  let map = {
    "1":"SAKIT",
    "2":"IZIN",
    "3":"CUTI",
    "4":"DINAS",
  };

  if(!map[ket]) return alert("Pilihan tidak valid");

  navigator.geolocation.getCurrentPosition(pos=>{

    fetch(URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        action:"keterangan",
        username:user.username,
        jenis:map[ket],
        lat:pos.coords.latitude,
        lng:pos.coords.longitude
      })
    })
    .then(res=>res.json())
    .then(res=>{
      alert(res.msg || "Berhasil");
    });

  });

}

//tracking

function kirimTracking(){

  navigator.geolocation.getCurrentPosition(pos=>{

    if(pos.coords.accuracy > 100){
      console.log("Akurasi jelek, skip");
      return;
    }

    fetch(URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        action:"tracking",
        username:user.username,
        lat:pos.coords.latitude,
        lng:pos.coords.longitude,
        acc:pos.coords.accuracy
      })
    });

    console.log("Tracking lembur terkirim");

  });

}
  
//start GPS
  let watchID;

function startGPS(){

  const macan = document.getElementById("macan");
  const bar = document.getElementById("bar");
  const text = document.getElementById("textStatus");
  const jarakText = document.getElementById("jarakText");

  macan.classList.add("jalan");

  watchID = navigator.geolocation.watchPosition(pos=>{

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    let latDB = user.lat;
    let lngDB = user.lng;
    let radius = user.radius || 50;

    let jarak = distance(lat, lng, latDB, lngDB);

    jarakText.innerText = "Jarak: " + Math.round(jarak) + " meter";

    // progress
    let persen = 100 - (jarak / radius * 100);
    persen = Math.max(0, Math.min(100, persen));
    bar.style.width = persen + "%";

    if(jarak > radius){

      text.innerText = "Mencari lokasi...";

      // jauh → jalan
 if(jarak > radius){

  text.innerText = "Mencari lokasi...";

  // RESET DULU
  macan.classList.remove("jalan","lari","kabur");

  // jauh → jalan
  if(jarak > radius * 2){
    macan.classList.add("jalan");
  }
  // dekat → lari
  else{
    macan.classList.add("lari");
  }

   macan.style.animation = "none";
   macan.offsetHeight; // trigger reflow
   macan.style.animation = "";

}else{

  text.innerText = "Anda dalam area";

  macan.classList.remove("jalan","lari");
  macan.classList.add("kabur");

  navigator.geolocation.clearWatch(watchID);

}
  });
}
  
</script>

</body>
</html>
