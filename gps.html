<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS Tracking</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f5f5f5;
  text-align:center;
}

/* ================= LOGO ATAS ================= */
.logo-top{
  width:95%;
  margin:20px auto 10px;
  display:block;
}

/* ================= HARAP TUNGGU ================= */
.loading-text{
  margin-top:10px;
}

.loading-text span{
  display:inline-block;
  font-weight:700;
  color:#ff0000;
  font-size:22px;
  opacity:0;
  animation:fadeSlide 1.5s infinite;
}

/* delay animasi */
.loading-text span:nth-child(1){animation-delay:0s;}
.loading-text span:nth-child(2){animation-delay:0.1s;}
.loading-text span:nth-child(3){animation-delay:0.2s;}
.loading-text span:nth-child(4){animation-delay:0.3s;}
.loading-text span:nth-child(5){animation-delay:0.4s;}
.loading-text span:nth-child(6){animation-delay:0.5s;}
.loading-text span:nth-child(7){animation-delay:0.6s;}
.loading-text span:nth-child(8){animation-delay:0.7s;}
.loading-text span:nth-child(9){animation-delay:0.8s;}
.loading-text span:nth-child(10){animation-delay:0.9s;}
.loading-text span:nth-child(11){animation-delay:1s;}
.loading-text span:nth-child(12){animation-delay:1.1s;}

@keyframes fadeSlide{
  0%{opacity:0; transform:translateX(20px);}
  50%{opacity:1; transform:translateX(0);}
  100%{opacity:0; transform:translateX(-10px);}
}

/* ================= STATUS ================= */
#textStatus{
  font-size:18px;
  font-weight:bold;
  margin-top:5px;
}

/* ================= RADAR ================= */
.radar{
  position:relative;
  width:220px;
  height:220px;
  margin:25px auto;
}

.circle{
  position:absolute;
  width:100%;
  height:100%;
  border:2px solid rgba(255,0,0,0.3);
  border-radius:50%;
  animation:pulseRadar 2s infinite;
}

.circle:nth-child(2){animation-delay:0.5s;}
.circle:nth-child(3){animation-delay:1s;}

@keyframes pulseRadar{
  0%{transform:scale(0.5); opacity:1;}
  100%{transform:scale(1.5); opacity:0;}
}

/* LOGO TENGAH */
.logo-center{
  position:absolute;
  width:120px;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  animation:zoomInOut 1.5s infinite;
}

/* zoom logo */
@keyframes zoomInOut{
  0%{ transform:scale(0.9); opacity:0.6; }
  50%{ transform:scale(1.2); opacity:1; }
  100%{ transform:scale(0.9); opacity:0.6; }
}

/* ================= JARAK ================= */
#jarakText{
  font-size:22px;
  font-weight:bold;
  margin-top:10px;
  transition:0.5s;
  text-shadow:
    -1px -1px 0 #000,
     1px -1px 0 #000,
    -1px  1px 0 #000,
     1px  1px 0 #000;
}

/* WARNA */
.merah{color:red;}
.kuning{color:orange;}
.hijau{color:green;}

/* ================= PROGRESS ================= */
.progress{
  width:80%;
  height:12px;
  background:#ddd;
  border-radius:10px;
  margin:20px auto;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0%;
  background:red;
  transition:0.5s;
}
</style>

</head>
<body>

<!-- LOGO -->
<img src="jelas.png" class="logo-top">

<!-- HARAP TUNGGU -->
<div class="loading-text">
  <span>H</span>
  <span>A</span>
  <span>R</span>
  <span>A</span>
  <span>P</span>
  <span>&nbsp;</span>
  <span>T</span>
  <span>U</span>
  <span>N</span>
  <span>G</span>
  <span>G</span>
  <span>U</span>
</div>

<!-- STATUS -->
<div id="textStatus">Mencari lokasi...</div>

<!-- RADAR -->
<div class="radar">
  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>
  <img src="jelasbulat.png" class="logo-center">
</div>

<!-- JARAK -->
<div id="jarakText">Jarak: - meter</div>

<!-- PROGRESS -->
<div class="progress">
  <div class="bar" id="bar"></div>
</div>

<script>

/* ================= CEK LOGIN ================= */
let raw = localStorage.getItem("userLogin");

if(!raw){
  alert("Silahkan login dulu!");
  location.href="index.html";
}

let parsed = JSON.parse(raw);
let user = parsed.user || parsed;

/* ================= HITUNG JARAK ================= */
function distance(lat1, lon1, lat2, lon2){
  const R = 6371e3;
  const φ1 = lat1 * Math.PI/180;
  const φ2 = lat2 * Math.PI/180;
  const Δφ = (lat2-lat1) * Math.PI/180;
  const Δλ = (lon2-lon1) * Math.PI/180;

  const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
            Math.cos(φ1) * Math.cos(φ2) *
            Math.sin(Δλ/2) * Math.sin(Δλ/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  return R * c;
}

/* ================= GPS ================= */
navigator.geolocation.watchPosition(pos=>{

  let lat = pos.coords.latitude;
  let lng = pos.coords.longitude;

  let latDB = parseFloat(user.lat);
  let lngDB = parseFloat(user.lng);
  let radius = parseFloat(user.radius) || 50;

  if(isNaN(latDB) || isNaN(lngDB)){
    document.getElementById("textStatus").innerText = "Lokasi kantor belum di setting";
    return;
  }

  let jarak = distance(lat, lng, latDB, lngDB);

  let textJarak = document.getElementById("jarakText");
  let textStatus = document.getElementById("textStatus");
  let bar = document.getElementById("bar");

  textJarak.innerText = "Jarak: " + Math.round(jarak) + " meter";

  let persen = 100 - (jarak / radius * 100);
  persen = Math.max(0, Math.min(100, persen));
  bar.style.width = persen + "%";

  textJarak.classList.remove("merah","kuning","hijau");

  if(jarak > radius){
    textJarak.classList.add("merah");
    bar.style.background = "red";
    textStatus.innerText = "DI LUAR AREA";
  }
  else if(jarak <= radius && jarak > radius * 0.5){
    textJarak.classList.add("kuning");
    bar.style.background = "orange";
    textStatus.innerText = "MENDEKATI AREA";
  }
  else{
    textJarak.classList.add("hijau");
    bar.style.background = "green";
    textStatus.innerText = "ANDA DALAM AREA";

    setTimeout(()=>{
      window.location.href = "absen.html";
    },1000);
  }

}, err=>{
  document.getElementById("textStatus").innerText = "GPS gagal";
},{
  enableHighAccuracy:true,
  maximumAge:0
});

</script>

</body>
</html>
