<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS Tracking</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  text-align:center;
}

/* LOGO ATAS */
.logo-atas{
  width:100%;
  max-width:400px;
  margin:20px auto 10px;
  display:block;
}

/* HARAP TUNGGU (TIDAK DIUBAH) */
.wait-text span{
  display:inline-block;
  font-weight:600;
  color:#ff0000;
  font-size:16px;
  opacity:0;
  animation:fadeSlide 1.5s infinite;
}
.wait-text span:nth-child(1){animation-delay:0s;}
.wait-text span:nth-child(2){animation-delay:0.1s;}
.wait-text span:nth-child(3){animation-delay:0.2s;}
.wait-text span:nth-child(4){animation-delay:0.3s;}
.wait-text span:nth-child(5){animation-delay:0.4s;}
.wait-text span:nth-child(6){animation-delay:0.5s;}
.wait-text span:nth-child(7){animation-delay:0.6s;}
.wait-text span:nth-child(8){animation-delay:0.7s;}
.wait-text span:nth-child(9){animation-delay:0.8s;}
.wait-text span:nth-child(10){animation-delay:0.9s;}
.wait-text span:nth-child(11){animation-delay:1s;}
.wait-text span:nth-child(12){animation-delay:1.1s;}

@keyframes fadeSlide{
  0%{opacity:0; transform:translateX(20px);}
  50%{opacity:1; transform:translateX(0);}
  100%{opacity:0; transform:translateX(-10px);}
}

/* RADAR FIX */
.radar{
  position:relative;
  width:200px;
  height:200px;
  margin:20px auto;
  display:flex;
  justify-content:center;
  align-items:center;
}

.radar::before,
.radar::after{
  content:"";
  position:absolute;
  border:2px solid rgba(255,0,0,0.2);
  border-radius:50%;
  width:100%;
  height:100%;
  animation:pulse 2s infinite;
}

.radar::after{animation-delay:1s;}

@keyframes pulse{
  0%{transform:scale(0.7); opacity:1;}
  100%{transform:scale(1.4); opacity:0;}
}

/* LOGO TENGAH FIX */
.logo-bulat{
  width:120px;
  position:absolute;
}

/* STATUS */
.status{
  font-size:20px;
  font-weight:bold;
  margin-top:10px;
}

/* JARAK FIX WARNA */
.jarak{
  font-size:18px;
  font-weight:bold;
  margin-top:5px;
  color:black;
}

/* BAR TIPIS */
.bar-container{
  width:70%;
  height:6px;
  background:#ddd;
  border-radius:10px;
  margin:20px auto;
}

.bar{
  height:100%;
  width:0%;
  background:red;
  transition:0.3s;
}

/* LOADING */
.loading-mode{
  display:none;
}

/* SEMI CIRCLE */
.semi{
  width:260px;
  margin:40px auto 10px;
}

.percent{
  font-size:32px;
  font-weight:bold;
}
</style>
</head>

<body>

<img src="jelas.png" class="logo-atas">

<div class="wait-text">
<span>H</span><span>A</span><span>R</span><span>A</span><span>P</span>
<span>&nbsp;</span>
<span>T</span><span>U</span><span>N</span><span>G</span><span>G</span><span>U</span>
</div>

<div id="mainUI">

<div class="radar">
<img src="jelasbulat.png" class="logo-bulat">
</div>

<div id="statusArea" class="status">Mencari lokasi...</div>
<div id="jarakText" class="jarak">Jarak: - meter</div>

<div class="bar-container">
<div id="bar" class="bar"></div>
</div>

</div>

<!-- LOADING -->
<div id="loadingUI" class="loading-mode">

<svg class="semi" viewBox="0 0 200 120">
  <path d="M10 110 A90 90 0 0 1 190 110"
        fill="none"
        stroke="#ddd"
        stroke-width="10"/>

  <path id="progressArc"
        d="M10 110 A90 90 0 0 1 190 110"
        fill="none"
        stroke="red"
        stroke-width="10"
        stroke-dasharray="283"
        stroke-dashoffset="283"/>
</svg>

<div class="percent" id="persenText">0%</div>

</div>

<script>

/* ================= SESSION ================= */
let raw = localStorage.getItem("userLogin");

if(!raw){
  alert("Login dulu!");
  location.href="index.html";
}

let parsed = JSON.parse(raw);

/* 🔥 HANYA IDENTITAS */
let user = {
  username: parsed.username || (parsed.user ? parsed.user.username : ""),
  device_id: parsed.device_id || (parsed.user ? parsed.user.device_id : "")
};

/* ================= LOAD USER LIVE ================= */
async function loadUserLive(){

  try{

    let res = await fetch(URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        action:"get_user",
        username: user.username,
        device_id: user.device_id
      })
    });

    let data = await res.json();

    if(data.status === "ok"){

      /* 🔥 OVERWRITE TOTAL (FULL LIVE) */
      user = data.data;

      startGPS();

    }else{
      alert(data.msg || "Gagal ambil data user");
    }

  }catch(e){
    alert("Koneksi gagal");
  }
}

/* ================= JARAK ================= */
function distance(lat1, lon1, lat2, lon2){
  const R = 6371e3;
  const φ1 = lat1 * Math.PI/180;
  const φ2 = lat2 * Math.PI/180;
  const Δφ = (lat2-lat1) * Math.PI/180;
  const Δλ = (lon2-lon1) * Math.PI/180;

  const a = Math.sin(Δφ/2)**2 +
            Math.cos(φ1)*Math.cos(φ2)*
            Math.sin(Δλ/2)**2;

  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* ================= GPS ================= */
let watchID;
let sudahMasuk = false;

function startGPS(){

  const status = document.getElementById("statusArea");
  const jarakText = document.getElementById("jarakText");
  const bar = document.getElementById("bar");

  watchID = navigator.geolocation.watchPosition(pos=>{

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    /* 🔥 DATA DARI BACKEND (LIVE) */
    let latDB = parseFloat(user.lat);
    let lngDB = parseFloat(user.lng);
    let radius = parseFloat(user.radius) || 50;

    /* 🔴 VALIDASI TAMBAHAN (BIAR GAK ERROR DIAM-DIAM) */
    if(!latDB || !lngDB){
      status.innerText = "LOKASI BELUM DISET";
      jarakText.innerText = "-";
      return;
    }

    let jarak = distance(lat, lng, latDB, lngDB);

    jarakText.innerText = "Jarak: " + Math.round(jarak) + " meter";

    let persen = 100 - (jarak / radius * 100);
    persen = Math.max(0, Math.min(100, persen));
    bar.style.width = persen + "%";

    if(jarak > radius){
      status.innerText = "DI LUAR AREA";
      jarakText.style.color = "red";
      bar.style.background = "red";
    }
    else if(jarak > radius * 0.5){
      status.innerText = "MENDEKATI AREA";
      jarakText.style.color = "orange";
      bar.style.background = "orange";
    }
    else{
      status.innerText = "ANDA DALAM AREA";
      jarakText.style.color = "green";
      bar.style.background = "green";

      if(!sudahMasuk){ 
        sudahMasuk = true; 

        setTimeout(()=>{
          navigator.geolocation.clearWatch(watchID); 
          startLoading(); 
        },5000); 
      }
    }

  }, err=>{
    alert("GPS error: " + err.message);
  },{
    enableHighAccuracy:true
  });
}

/* ================= LOADING ================= */
function startLoading(){

  document.getElementById("mainUI").style.display="none";
  document.getElementById("loadingUI").style.display="block";

  let persen = 0;
  let text = document.getElementById("persenText");
  let arc = document.getElementById("progressArc");

  let interval = setInterval(()=>{

    persen += 2;

    let offset = 283 - (283 * persen / 100);
    arc.style.strokeDashoffset = offset;

    let r,g;
    if(persen <= 50){
      r = 255;
      g = Math.round(5.1 * persen);
    }else{
      g = 255;
      r = Math.round(255 - (5.1 * (persen - 50)));
    }
    arc.setAttribute("stroke", `rgb(${r},${g},0)`);

    text.innerText = persen + "%";

    if(persen >= 100){
      clearInterval(interval);
      location.href="absen.html";
    }

  },100);
}

/* ================= START ================= */
loadUserLive();

</script>

</body>
</html>
