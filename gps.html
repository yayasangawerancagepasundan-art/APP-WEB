<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS Tracking</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  text-align:center;
  background:#fff;
}

/* LOGO ATAS */
.logo-atas{
  width:100%;
  max-width:350px;
  margin-top:20px;
}

/* HARAP TUNGGU */
.loading-text{
  margin-top:10px;
  font-weight:bold;
  letter-spacing:5px;
  color:#999;
  animation:fadeText 1.5s infinite;
}

@keyframes fadeText{
  0%{opacity:0.2}
  50%{opacity:1}
  100%{opacity:0.2}
}

/* RADAR */
.radar{
  position:relative;
  margin:40px auto;
  width:220px;
  height:220px;
}

.radar::before,
.radar::after{
  content:"";
  position:absolute;
  border:2px solid rgba(255,0,0,0.2);
  border-radius:50%;
  width:100%;
  height:100%;
  animation:radar 2s linear infinite;
}

.radar::after{
  animation-delay:1s;
}

@keyframes radar{
  0%{transform:scale(0.5);opacity:1}
  100%{transform:scale(1.5);opacity:0}
}

/* LOGO TENGAH */
.logo-tengah{
  width:120px;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* STATUS */
.status{
  font-size:20px;
  font-weight:bold;
}

/* JARAK */
.jarak{
  font-size:22px;
  font-weight:bold;
  margin-top:10px;
  -webkit-text-stroke:1px black;
}

/* BAR */
.bar-wrap{
  width:80%;
  height:12px;
  background:#ddd;
  border-radius:10px;
  margin:20px auto;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0%;
  background:red;
  transition:0.3s;
}

/* LOADING 5 DETIK */
#loading5{
  display:none;
  margin-top:50px;
}

.semi{
  width:200px;
  height:100px;
  border:10px solid #ddd;
  border-top:10px solid red;
  border-radius:200px 200px 0 0;
  margin:0 auto;
  position:relative;
  overflow:hidden;
}

.percent{
  font-size:30px;
  font-weight:bold;
  margin-top:20px;
}

</style>
</head>

<body>

<!-- MODE GPS -->
<div id="gpsContent">

<img src="jelas.png" class="logo-atas">

<div class="loading-text">HARAP TUNGGU</div>

<div class="radar">
  <img src="jelasbulat.png" class="logo-tengah">
</div>

<div id="status" class="status">Mencari lokasi...</div>
<div id="jarak" class="jarak">Jarak: - meter</div>

<div class="bar-wrap">
  <div id="bar" class="bar"></div>
</div>

</div>

<!-- MODE LOADING 5 DETIK -->
<div id="loading5">
  <div class="semi" id="semiBar"></div>
  <div class="percent" id="percent">0%</div>
</div>

<script>

/* ===== CEK LOGIN ===== */
let raw = localStorage.getItem("userLogin");
if(!raw){
  alert("Login dulu");
  location.href="index.html";
}

let user = JSON.parse(raw).user || JSON.parse(raw);

/* ===== DISTANCE ===== */
function distance(lat1, lon1, lat2, lon2){
  const R = 6371e3;
  const φ1 = lat1*Math.PI/180;
  const φ2 = lat2*Math.PI/180;
  const Δφ = (lat2-lat1)*Math.PI/180;
  const Δλ = (lon2-lon1)*Math.PI/180;

  const a = Math.sin(Δφ/2)**2 +
            Math.cos(φ1)*Math.cos(φ2)*
            Math.sin(Δλ/2)**2;

  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

/* ===== GPS ===== */
let watchID;
let sudahMasuk = false;

watchID = navigator.geolocation.watchPosition(pos=>{

  let lat = pos.coords.latitude;
  let lng = pos.coords.longitude;

  let latDB = Number(user.lat);
  let lngDB = Number(user.lng);
  let radius = Number(user.radius) || 50;

  let jarak = distance(lat,lng,latDB,lngDB);

  let status = document.getElementById("status");
  let jarakText = document.getElementById("jarak");
  let bar = document.getElementById("bar");

  jarakText.innerText = "Jarak: " + Math.round(jarak) + " meter";

  /* WARNA DINAMIS */
  if(jarak > radius){
    status.innerText = "DI LUAR AREA";
    status.style.color = "red";
    jarakText.style.color = "red";
    bar.style.background = "red";
  }
  else if(jarak > radius*0.5){
    status.innerText = "MENDEKATI AREA";
    status.style.color = "orange";
    jarakText.style.color = "orange";
    bar.style.background = "orange";
  }
  else{
    status.innerText = "ANDA DALAM AREA";
    status.style.color = "green";
    jarakText.style.color = "green";
    bar.style.background = "green";
  }

  /* PROGRESS */
  let persen = 100 - (jarak/radius*100);
  persen = Math.max(0, Math.min(100, persen));
  bar.style.width = persen + "%";

  /* MASUK AREA */
  if(jarak <= radius && !sudahMasuk){

    sudahMasuk = true;

    navigator.geolocation.clearWatch(watchID);

    // STOP UI GPS
    document.getElementById("gpsContent").style.display="none";

    // SHOW LOADING
    document.getElementById("loading5").style.display="block";

    startLoading();

  }

}, err=>{
  alert("GPS error");
},{
  enableHighAccuracy:true
});

/* ===== LOADING 5 DETIK ===== */
function startLoading(){

  let persen = 0;
  let el = document.getElementById("percent");
  let semi = document.getElementById("semiBar");

  let interval = setInterval(()=>{

    persen++;
    el.innerText = persen + "%";

    semi.style.borderTopColor = `hsl(${persen*1.2},100%,50%)`;

    if(persen >= 100){
      clearInterval(interval);

      setTimeout(()=>{
        location.href="absen.html";
      },300);
    }

  },50); // 5 detik

}

</script>

</body>
</html>
