<!DOCTYPE html> 
<html lang="id"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 

<title>GPS Tracking</title> 

<style> 
body{ 
  margin:0; 
  font-family: Arial, sans-serif; 
  background:#f5f5f5; 
  text-align:center; 
} 

/* ================= LOGO ATAS ================= */ 
.logo-atas{ 
  width:100%; 
  max-width:400px; 
  margin:20px auto 10px; 
  display:block; 
} 

/* ================= HARAP TUNGGU ================= */ 
.wait-text{ 
  font-weight:bold; 
  letter-spacing:5px; 
  color:#555; 
  animation: blink 1.2s infinite; 
} 

@keyframes blink{ 
  0%{opacity:1;} 
  50%{opacity:0.3;} 
  100%{opacity:1;} 
} 

/* ================= RADAR ================= */ 
.radar{ 
  position:relative; 
  width:200px; 
  height:200px; 
  margin:20px auto; 
  display:flex;
  align-items:center;
  justify-content:center;
} 

.radar::before, 
.radar::after{ 
  content:""; 
  position:absolute; 
  border:2px solid rgba(255,0,0,0.2); 
  border-radius:50%; 
  width:100%; 
  height:100%; 
  animation: pulse 2s infinite; 
} 

.radar::after{ 
  animation-delay:1s; 
} 

@keyframes pulse{ 
  0%{ 
    transform:scale(0.6); 
    opacity:1; 
  } 
  100%{ 
    transform:scale(1.4); 
    opacity:0; 
  } 
} 

/* ================= LOGO TENGAH ================= */ 
.logo-bulat{ 
  width:120px; 
  position:relative;
  z-index:2;
} 

/* ================= STATUS ================= */ 
.status{ 
  font-size:20px; 
  font-weight:bold; 
  margin-top:10px; 
} 

/* ================= JARAK ================= */ 
.jarak{ 
  font-size:18px; 
  font-weight:bold; 
  margin-top:5px; 
  text-shadow:1px 1px 2px #000; 
} 

/* ================= BAR ================= */ 
.bar-container{ 
  width:80%; 
  height:10px; 
  background:#ddd; 
  border-radius:10px; 
  margin:20px auto; 
  overflow:hidden; 
} 

.bar{ 
  height:100%; 
  width:0%; 
  background:red; 
  transition:0.5s; 
} 

/* ================= LOADING MODE ================= */ 
.loading-mode{ 
  display:none; 
} 

/* ================= SEMI CIRCLE ================= */
.semi-circle{
  width:200px;
  height:100px;
  border-top-left-radius:200px;
  border-top-right-radius:200px;
  border:10px solid #ddd;
  border-bottom:none;
  margin:50px auto 10px;
  position:relative;
  overflow:hidden;
}

.semi-fill{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:100%;
  border-top-left-radius:200px;
  border-top-right-radius:200px;
  border:10px solid limegreen;
  border-bottom:none;
  transform:rotate(-180deg);
  transform-origin:bottom center;
}

.loading-text{ 
  font-size:40px; 
  font-weight:bold; 
  margin-top:10px; 
} 
</style> 
</head> 

<body> 

<img src="jelas.png" class="logo-atas"> 
<div class="wait-text">HARAP TUNGGU</div> 

<div id="mainUI"> 

  <div class="radar"> 
    <img src="jelasbulat.png" class="logo-bulat"> 
  </div> 

  <div id="statusArea" class="status">Mencari lokasi...</div> 

  <div id="jarakText" class="jarak">Jarak: - meter</div> 

  <div class="bar-container"> 
    <div id="bar" class="bar"></div> 
  </div> 

</div> 

<!-- LOADING -->
<div id="loadingUI" class="loading-mode"> 

  <div class="semi-circle">
    <div id="semiFill" class="semi-fill"></div>
  </div>

  <div class="loading-text" id="persenText">0%</div> 

</div> 

<script> 

let raw = localStorage.getItem("userLogin"); 
if(!raw){ 
  alert("Login dulu!"); 
  location.href="index.html"; 
} 

let parsed = JSON.parse(raw); 
let user = parsed.user || parsed; 

function distance(lat1, lon1, lat2, lon2){ 
  const R = 6371e3; 
  const φ1 = lat1 * Math.PI/180; 
  const φ2 = lat2 * Math.PI/180; 
  const Δφ = (lat2-lat1) * Math.PI/180; 
  const Δλ = (lon2-lon1) * Math.PI/180; 

  const a = Math.sin(Δφ/2)**2 + 
            Math.cos(φ1)*Math.cos(φ2)* 
            Math.sin(Δλ/2)**2; 

  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
} 

let watchID; 
let sudahMasuk = false; 

function startGPS(){ 

  const status = document.getElementById("statusArea"); 
  const jarakText = document.getElementById("jarakText"); 
  const bar = document.getElementById("bar"); 

  watchID = navigator.geolocation.watchPosition(pos=>{ 

    let lat = pos.coords.latitude; 
    let lng = pos.coords.longitude; 

    let latDB = parseFloat(user.lat); 
    let lngDB = parseFloat(user.lng); 
    let radius = parseFloat(user.radius) || 50; 

    let jarak = distance(lat, lng, latDB, lngDB); 

    jarakText.innerText = "Jarak: " + Math.round(jarak) + " meter"; 

    let persen = 100 - (jarak / radius * 100); 
    persen = Math.max(0, Math.min(100, persen)); 
    bar.style.width = persen + "%"; 

    if(jarak > radius){ 
      status.innerText = "DI LUAR AREA"; 
      jarakText.style.color = "red"; 
      bar.style.background = "red"; 
    } 
    else if(jarak > radius * 0.5){ 
      status.innerText = "MENDEKATI AREA"; 
      jarakText.style.color = "orange"; 
      bar.style.background = "orange"; 
    } 
    else{ 
      status.innerText = "ANDA DALAM AREA"; 
      jarakText.style.color = "green"; 
      bar.style.background = "green"; 

      if(!sudahMasuk){ 
        sudahMasuk = true; 

        navigator.geolocation.clearWatch(watchID); 

        startLoading(); 
      } 
    } 

  }, err=>{ 
    alert("GPS error: " + err.message); 
  },{ 
    enableHighAccuracy:true 
  }); 

} 

/* ================= LOADING 5 DETIK ================= */ 
function startLoading(){ 

  document.getElementById("mainUI").style.display = "none"; 
  document.getElementById("loadingUI").style.display = "block"; 

  let persen = 0; 
  let text = document.getElementById("persenText"); 
  let fill = document.getElementById("semiFill"); 

  let interval = setInterval(()=>{ 

    persen += 2; 
    text.innerText = persen + "%"; 

    let deg = -180 + (persen * 1.8);
    fill.style.transform = "rotate(" + deg + "deg)";

    if(persen >= 100){ 
      clearInterval(interval); 
      window.location.href = "absen.html"; 
    } 

  },100); 

} 

startGPS(); 

</script> 

</body> 
</html>
