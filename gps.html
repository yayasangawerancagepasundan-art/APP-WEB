<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS</title>

<style>

/* ================= GLOBAL ================= */
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f5f5f5;
}

/* ================= HEADER (LOGO BESAR) ================= */
.header{
  width:100%;
  padding:10px 0;
  text-align:center;
}

.header img{
  width:90%;   /* 🔥 FULL LEBAR */
  max-width:400px;
}

/* ================= CENTER ================= */
.center{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:70vh;
  text-align:center;
}

/* ================= RADAR ================= */
.radar-wrapper{
  position:relative;
  width:200px;
  height:200px;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* radar layer 1 */
.radar{
  position:absolute;
  width:200px;
  height:200px;
  border-radius:50%;
  border:2px solid rgba(255,0,0,0.3);
  animation: radarPulse 2s infinite;
}

/* radar layer 2 (biar halus kayak dashboard) */
.radar2{
  animation-delay:1s;
}

@keyframes radarPulse{
  0%{
    transform:scale(0.5);
    opacity:0.7;
  }
  70%{
    transform:scale(1.6);
    opacity:0;
  }
  100%{
    opacity:0;
  }
}

/* ================= LOGO TENGAH ================= */
.logo-big{
  width:120px;
  z-index:2;
}

/* ================= TEXT ================= */
.status{
  margin-top:20px;
  font-size:18px;
  color:#555;
}

.jarak{
  margin-top:10px;
  font-size:16px;
  color:#888;
}

/* ================= PROGRESS ================= */
.progress{
  width:200px;
  height:6px;
  background:#ddd;
  border-radius:10px;
  margin-top:15px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0%;
  background:red;
  transition:0.3s;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <img src="jelas.png">
</div>

<!-- CENTER -->
<div class="center">

  <div class="radar-wrapper">

    <div class="radar"></div>
    <div class="radar radar2"></div>

    <img src="jelasbulat.png" class="logo-big">

  </div>

  <div class="status" id="textStatus">
    Mencari lokasi...
  </div>

  <div class="jarak" id="jarakText">
    Jarak: - meter
  </div>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

</div>

<script>

/* ================= CEK LOGIN ================= */
let raw = localStorage.getItem("userLogin");

if(!raw){
  alert("Silahkan login dulu!");
  location.href="index.html";
}

let parsed = JSON.parse(raw);
let user = parsed.user || parsed;

/* ================= HITUNG JARAK ================= */
function distance(lat1, lon1, lat2, lon2){
  const R = 6371e3;
  const φ1 = lat1 * Math.PI/180;
  const φ2 = lat2 * Math.PI/180;
  const Δφ = (lat2-lat1) * Math.PI/180;
  const Δλ = (lon2-lon1) * Math.PI/180;

  const a = Math.sin(Δφ/2)*Math.sin(Δφ/2) +
            Math.cos(φ1)*Math.cos(φ2) *
            Math.sin(Δλ/2)*Math.sin(Δλ/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  return R * c;
}

/* ================= GPS ================= */
function startGPS(){

  const textStatus = document.getElementById("textStatus");
  const textJarak = document.getElementById("jarakText");
  const bar = document.getElementById("bar");

  navigator.geolocation.watchPosition(pos=>{

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    let latDB = Number(user.lat);
    let lngDB = Number(user.lng);
    let radius = Number(user.radius) || 50;

    if(isNaN(latDB) || isNaN(lngDB)){
      textStatus.innerText = "Lokasi kantor belum di setting";
      return;
    }

    let jarak = distance(lat, lng, latDB, lngDB);

    textJarak.innerText = "Jarak: " + Math.round(jarak) + " meter";

    let persen = 100 - (jarak / radius * 100);
    persen = Math.max(0, Math.min(100, persen));
    bar.style.width = persen + "%";

    if(jarak <= radius){
      textStatus.innerText = "ANDA DALAM AREA";

      setTimeout(()=>{
        location.href = "absen.html";
      },1000);

    }else{
      textStatus.innerText = "Menuju area (" + Math.round(jarak - radius) + "m lagi)";
    }

  }, err=>{
    textStatus.innerText = "Gagal ambil GPS";
  },{
    enableHighAccuracy:true
  });

}

/* ================= INIT ================= */
startGPS();

</script>

</body>
</html>
