<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS Tracking</title>

<style>

/* ================= BODY ================= */
body{
  font-family: Arial;
  text-align:center;
  background:#fff;
  margin:0;
  padding:20px;
}

/* ================= LOADING ================= */
.loading{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.95);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  text-align:center;
}

.loading-box{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.loading-logo{
  width:120px;
  margin-bottom:15px;
}

.loading-text span{
  display:inline-block;
  font-weight:600;
  color:#ff0000;
  font-size:16px;
  opacity:0;
  animation:fadeSlide 1.5s infinite;
}

.loading-text span:nth-child(1){animation-delay:0s;}
.loading-text span:nth-child(2){animation-delay:0.1s;}
.loading-text span:nth-child(3){animation-delay:0.2s;}
.loading-text span:nth-child(4){animation-delay:0.3s;}
.loading-text span:nth-child(5){animation-delay:0.4s;}
.loading-text span:nth-child(6){animation-delay:0.5s;}
.loading-text span:nth-child(7){animation-delay:0.6s;}
.loading-text span:nth-child(8){animation-delay:0.7s;}
.loading-text span:nth-child(9){animation-delay:0.8s;}
.loading-text span:nth-child(10){animation-delay:0.9s;}
.loading-text span:nth-child(11){animation-delay:1s;}
.loading-text span:nth-child(12){animation-delay:1.1s;}

@keyframes fadeSlide{
  0%{opacity:0; transform:translateX(20px);}
  50%{opacity:1; transform:translateX(0);}
  100%{opacity:0; transform:translateX(-10px);}
}

/* ================= TEXT ZOOM ================= */
.zoom-anim{
  animation: zoomInOut 1.5s infinite ease-in-out;
}

@keyframes zoomInOut{
  0%{ transform:scale(0.9); opacity:0.6; }
  50%{ transform:scale(1.2); opacity:1; }
  100%{ transform:scale(0.9); opacity:0.6; }
}

/* ================= RADAR ================= */
.radar{
  position:relative;
  width:200px;
  height:200px;
  margin:20px auto;
}

.circle{
  position:absolute;
  width:100%;
  height:100%;
  border:2px solid rgba(255,0,0,0.3);
  border-radius:50%;
  animation:radarPulse 2s infinite;
}

.circle:nth-child(2){animation-delay:0.5s;}
.circle:nth-child(3){animation-delay:1s;}

@keyframes radarPulse{
  0%{ transform:scale(0.5); opacity:1; }
  100%{ transform:scale(1.5); opacity:0; }
}

/* LOGO */
#radarIcon{
  position:absolute;
  width:120px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  animation:iconPulse 1.5s infinite ease-in-out;
}

@keyframes iconPulse{
  0%   { transform:translate(-50%,-50%) scale(1); }
  50%  { transform:translate(-50%,-50%) scale(1.15); }
  100% { transform:translate(-50%,-50%) scale(1); }
}

/* ================= PROGRESS ================= */
.progress{
  width:100%;
  height:10px;
  background:#eee;
  border-radius:10px;
  margin-top:10px;
}

#bar{
  height:100%;
  width:0%;
  background:red;
  border-radius:10px;
}

</style>
</head>

<body>

<!-- LOADING -->
<div class="loading" id="loadingGPS">
  <div class="loading-box">
    <img src="jelasbulat.png" class="loading-logo">
    <div class="loading-text">
      <span>M</span><span>e</span><span>n</span><span>c</span><span>a</span><span>r</span><span>i</span>
      <span> </span>
      <span>G</span><span>P</span><span>S</span>
    </div>
  </div>
</div>

<h3 id="textStatus" class="zoom-anim">Mencari lokasi...</h3>
<p id="jarakText">Jarak: - meter</p>

<div class="radar">
  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>

  <img src="jelasbulat.png" id="radarIcon">
</div>

<div class="progress">
  <div id="bar"></div>
</div>

<script>

/* ================= AMBIL USER ================= */
let raw = localStorage.getItem("userLogin");

if(!raw){
  alert("Silahkan login dulu!");
  location.href = "index.html";
}

let parsed = JSON.parse(raw);
let user = parsed.user || parsed;

console.log("USER GPS:", user);

/* ================= HITUNG JARAK ================= */
function distance(lat1, lon1, lat2, lon2){
  const R = 6371e3;
  const φ1 = lat1 * Math.PI/180;
  const φ2 = lat2 * Math.PI/180;
  const Δφ = (lat2-lat1) * Math.PI/180;
  const Δλ = (lon2-lon1) * Math.PI/180;

  const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
            Math.cos(φ1) * Math.cos(φ2) *
            Math.sin(Δλ/2) * Math.sin(Δλ/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  return R * c;
}

/* ================= GPS ================= */
let watchID;

function startGPS(){

  const textStatus = document.getElementById("textStatus");
  const textJarak = document.getElementById("jarakText");
  const bar = document.getElementById("bar");
  const loading = document.getElementById("loadingGPS");

  let latDB = parseFloat(user.lat);
  let lngDB = parseFloat(user.lng);
  let radius = parseFloat(user.radius) || 50;

  if(isNaN(latDB) || isNaN(lngDB)){
    textStatus.innerText = "Lokasi kantor belum di setting";
    loading.style.display = "none";
    return;
  }

  watchID = navigator.geolocation.watchPosition(pos=>{

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    let jarak = distance(lat, lng, latDB, lngDB);

    loading.style.display = "none";

    textJarak.innerText = "Jarak: " + Math.round(jarak) + " meter";

    let persen = 100 - (jarak / radius * 100);
    persen = Math.max(0, Math.min(100, persen));
    bar.style.width = persen + "%";

    if(jarak > radius){

      textStatus.innerText = "Di luar area (" + Math.round(jarak - radius) + "m lagi)";

    }else{

      textStatus.innerText = "ANDA DALAM AREA";

      navigator.geolocation.clearWatch(watchID);

      setTimeout(()=>{
        location.href = "absen.html";
      },1000);

    }

  }, err=>{
    loading.style.display = "none";
    textStatus.innerText = "GPS gagal: " + err.message;
  },{
    enableHighAccuracy:true,
    maximumAge:0
  });

}

/* ================= INIT ================= */
startGPS();

</script>

</body>
</html>
