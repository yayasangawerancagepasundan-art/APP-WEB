<!DOCTYPE html> 
<html lang="id"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>GPS Tracking</title> 

<style> 
body{ 
  margin:0; 
  font-family: Arial, sans-serif; 
  background:#f5f5f5; 
  text-align:center; 
} 

/* ================= LOGO ATAS ================= */ 
.logo-atas{ 
  width:100%; 
  max-width:400px; 
  margin:20px auto 10px; 
  display:block; 
} 

/* ================= HARAP TUNGGU (ASLI DASHBOARD) ================= */
.loading-text span{
  display:inline-block;
  font-weight:600;
  color:#ff0000;
  font-size:16px;
  opacity:0;
  animation:fadeSlide 1.5s infinite;
}
.loading-text span:nth-child(1){animation-delay:0s;}
.loading-text span:nth-child(2){animation-delay:0.1s;}
.loading-text span:nth-child(3){animation-delay:0.2s;}
.loading-text span:nth-child(4){animation-delay:0.3s;}
.loading-text span:nth-child(5){animation-delay:0.4s;}
.loading-text span:nth-child(6){animation-delay:0.5s;}
.loading-text span:nth-child(7){animation-delay:0.6s;}
.loading-text span:nth-child(8){animation-delay:0.7s;}
.loading-text span:nth-child(9){animation-delay:0.8s;}
.loading-text span:nth-child(10){animation-delay:0.9s;}
.loading-text span:nth-child(11){animation-delay:1s;}
.loading-text span:nth-child(12){animation-delay:1.1s;}

@keyframes fadeSlide{
  0%{opacity:0; transform:translateX(20px);}
  50%{opacity:1; transform:translateX(0);}
  100%{opacity:0; transform:translateX(-10px);}
}

/* ================= RADAR ================= */ 
.radar{ 
  position:relative; 
  width:200px; 
  height:200px; 
  margin:20px auto; 
} 

.radar::before, 
.radar::after{ 
  content:""; 
  position:absolute; 
  border:2px solid rgba(255,0,0,0.2); 
  border-radius:50%; 
  width:100%; 
  height:100%; 
  animation: pulse 2s infinite; 
} 

.radar::after{ 
  animation-delay:1s; 
} 

@keyframes pulse{ 
  0%{ transform:scale(0.5); opacity:1; } 
  100%{ transform:scale(1.5); opacity:0; } 
} 

/* ================= LOGO TENGAH FIX ================= */
.logo-bulat{ 
  width:120px; 
  position:absolute; 
  top:50%; 
  left:50%; 
  transform:translate(-50%, -50%); 
} 

/* ================= STATUS ================= */ 
.status{ 
  font-size:20px; 
  font-weight:bold; 
  margin-top:10px; 
} 

/* ================= JARAK FIX (TIPIS) ================= */ 
.jarak{ 
  font-size:18px; 
  font-weight:bold; 
  margin-top:5px; 
  text-shadow:0.5px 0.5px 1px #000; 
} 

/* ================= BAR ================= */ 
.bar-container{ 
  width:80%; 
  height:10px; 
  background:#ddd; 
  border-radius:10px; 
  margin:20px auto; 
  overflow:hidden; 
} 

.bar{ 
  height:100%; 
  width:0%; 
  background:red; 
  transition:0.5s; 
} 

/* ================= LOADING 5 DETIK (SETENGAH LINGKARAN) ================= */
.loading-mode{ display:none; }

.circle{
  width:220px;
  height:110px;
  border:10px solid #ddd;
  border-bottom:none;
  border-radius:220px 220px 0 0;
  margin:80px auto 10px;
  position:relative;
  overflow:hidden;
}

.circle-fill{
  position:absolute;
  bottom:0;
  left:0;
  height:100%;
  width:0%;
  border-top:10px solid #00cc00;
  border-radius:220px 220px 0 0;
}

.loading-text2{
  font-size:40px;
  font-weight:bold;
}
</style> 
</head> 

<body> 

<img src="jelas.png" class="logo-atas"> 

<div class="loading-text">
<span>H</span><span>A</span><span>R</span><span>A</span><span>P</span>
<span>&nbsp;</span>
<span>T</span><span>U</span><span>N</span><span>G</span><span>G</span><span>U</span>
</div>

<div id="mainUI"> 

  <div class="radar"> 
    <img src="jelasbulat.png" class="logo-bulat"> 
  </div> 

  <div id="statusArea" class="status">Mencari lokasi...</div> 
  <div id="jarakText" class="jarak">Jarak: - meter</div> 

  <div class="bar-container"> 
    <div id="bar" class="bar"></div> 
  </div> 

</div> 

<div id="loadingUI" class="loading-mode"> 
  <div class="circle">
    <div id="circleFill" class="circle-fill"></div>
  </div>
  <div id="persenText" class="loading-text2">0%</div>
</div> 

<script> 

let raw = localStorage.getItem("userLogin"); 
if(!raw){ 
  alert("Login dulu!"); 
  location.href="index.html"; 
} 

let parsed = JSON.parse(raw); 
let user = parsed.user || parsed; 

function distance(lat1, lon1, lat2, lon2){ 
  const R = 6371e3; 
  const φ1 = lat1 * Math.PI/180; 
  const φ2 = lat2 * Math.PI/180; 
  const Δφ = (lat2-lat1) * Math.PI/180; 
  const Δλ = (lon2-lon1) * Math.PI/180; 

  const a = Math.sin(Δφ/2)**2 + 
            Math.cos(φ1)*Math.cos(φ2)* 
            Math.sin(Δλ/2)**2; 

  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
} 

let watchID; 
let sudahMasuk = false; 

function startGPS(){ 

  const status = document.getElementById("statusArea"); 
  const jarakText = document.getElementById("jarakText"); 
  const bar = document.getElementById("bar"); 

  watchID = navigator.geolocation.watchPosition(pos=>{ 

    let lat = pos.coords.latitude; 
    let lng = pos.coords.longitude; 

    let latDB = parseFloat(user.lat); 
    let lngDB = parseFloat(user.lng); 
    let radius = parseFloat(user.radius) || 50; 

    let jarak = distance(lat, lng, latDB, lngDB); 

    jarakText.innerText = "Jarak: " + Math.round(jarak) + " meter"; 

    let persen = 100 - (jarak / radius * 100); 
    persen = Math.max(0, Math.min(100, persen)); 
    bar.style.width = persen + "%"; 

    if(jarak > radius){ 
      status.innerText = "DI LUAR AREA"; 
      jarakText.style.color = "red"; 
      bar.style.background = "red"; 
    } 
    else if(jarak > radius * 0.5){ 
      status.innerText = "MENDEKATI AREA"; 
      jarakText.style.color = "orange"; 
      bar.style.background = "orange"; 
    } 
    else{ 
      status.innerText = "ANDA DALAM AREA"; 
      jarakText.style.color = "green"; 
      bar.style.background = "green"; 

      if(!sudahMasuk){ 
        sudahMasuk = true; 
        navigator.geolocation.clearWatch(watchID); 
        startLoading(); 
      } 
    } 

  }); 
} 

/* ================= LOADING SETENGAH LINGKARAN ================= */
function startLoading(){ 

  document.getElementById("mainUI").style.display = "none"; 
  document.getElementById("loadingUI").style.display = "block"; 

  let persen = 0; 
  let text = document.getElementById("persenText"); 
  let fill = document.getElementById("circleFill"); 

  let interval = setInterval(()=>{ 

    persen++; 
    text.innerText = persen + "%"; 
    fill.style.width = persen + "%"; 

    if(persen >= 100){ 
      clearInterval(interval); 
      window.location.href = "absen.html"; 
    } 

  },50); // 5 detik smooth 

} 

startGPS(); 

</script> 
</body> 
</html>
